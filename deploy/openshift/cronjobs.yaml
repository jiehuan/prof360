# Every 6 hours. Suspended until a premium Alpha Vantage key is configured (NEWS_SENTIMENT is premium).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uw-news
  namespace: PLACEHOLDER_NAMESPACE
  labels: {app: uw-pipeline, job: uw-news}
spec:
  # Every 6 hours, offset from nightly (23:30) and morning (05:30): SQLite has one writer.
  schedule: "0 3,9,15,21 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid          # the pipeline's own run lock is the second line of defence
  startingDeadlineSeconds: 3600
  suspend: false
  successfulJobsHistoryLimit: 3
