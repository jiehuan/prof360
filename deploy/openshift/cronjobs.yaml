              args: ["run", "--job", "news"]
              envFrom:
                - secretRef: {name: uw-pipeline-secrets}
              env:
                - {name: LOG_FORMAT, value: json}
                - {name: ALPHAVANTAGE_CALLS_PER_MINUTE, value: "75"}  # premium plan
                - {name: ALPHAVANTAGE_DAILY_QUOTA, value: "0"}        # 0 = unlimited
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: "1", memory: 2Gi}
