# 23:30 ET: SEC accepts filings until 22:00 ET, so the evening's filings make the next morning.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: uw-nightly
  namespace: PLACEHOLDER_NAMESPACE
  labels: {app: uw-pipeline, job: uw-nightly}
spec:
  schedule: "30 23 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid          # the pipeline's own run lock is the second line of defence
  startingDeadlineSeconds: 3600
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2                # a retried pod resumes the same run (unfinished tasks only)
      activeDeadlineSeconds: 14400
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: {app: uw-pipeline, job: uw-nightly}
        spec:
          restartPolicy: Never
          containers:
            - name: uw-pipeline
              image: PLACEHOLDER_IMAGE:latest
              args: ["run", "--job", "nightly"]
              envFrom:
                - secretRef: {name: uw-pipeline-secrets}
              env:
                - {name: LOG_FORMAT, value: json}
                - {name: ALPHAVANTAGE_CALLS_PER_MINUTE, value: "75"}  # premium plan
                - {name: ALPHAVANTAGE_DAILY_QUOTA, value: "0"}        # 0 = unlimited
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: "1", memory: 2Gi}
              volumeMounts:
                - {name: data, mountPath: /data}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: uw-pipeline-data}
---
