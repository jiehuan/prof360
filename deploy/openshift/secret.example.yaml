# Example only - never commit real values. Create the secret from a local env file instead:
#   oc create secret generic uw-pipeline-secrets --from-env-file=uw.env
apiVersion: v1
kind: Secret
metadata:
  name: uw-pipeline-secrets
  namespace: PLACEHOLDER_NAMESPACE
type: Opaque
stringData:
  SEC_USER_AGENT: "Name contact@example.com"
  SECUREGPT_CLIENT_ID: ""
  SECUREGPT_CLIENT_SECRET: ""
  SECUREGPT_SUBSCRIPTION_KEY: ""
  SECUREGPT_ENV: "dv"               # dv | pp | pr
  # Only when config/llm.yaml has provider: anthropic
  # ANTHROPIC_API_KEY: ""
  # ANTHROPIC_WORKSPACE_ID: ""
  ALPHAVANTAGE_API_KEY: ""
  # DATABASE_URL: "mssql+pyodbc://..."   # Azure SQL later; default is SQLite on the PVC
  # APP_DATABASE_URL: "mssql+pyodbc://..."   # application database written by `publish`
