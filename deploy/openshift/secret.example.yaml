# Example only - never commit real values. Create the secret from a local env file instead:
#   oc create secret generic uw-pipeline-secrets --from-env-file=uw.env
apiVersion: v1
kind: Secret
metadata:
  name: uw-pipeline-secrets
  namespace: PLACEHOLDER_NAMESPACE
type: Opaque
stringData:
  SEC_USER_AGENT: "Name contact@example.com"
  SECUREGPT_CLIENT_ID: ""
  SECUREGPT_CLIENT_SECRET: ""
  SECUREGPT_SUBSCRIPTION_KEY: ""
  SECUREGPT_ENV: "dv"               # dv | pp | pr
  # Only when config/llm.yaml has provider: anthropic
  # ANTHROPIC_API_KEY: ""
  # ANTHROPIC_WORKSPACE_ID: ""
  ALPHAVANTAGE_API_KEY: ""
  # Azure SQL + ADLS (D-040; non-secret settings in config/azure.yaml)
  DATABASE_BACKEND: "azure_sql"
  STORAGE_BACKEND: "adls"
  AZURE_ENV: "dv"                   # dv | pp | pr
  AZURE_SQL_CLIENT_ID: ""
  AZURE_SQL_CLIENT_SECRET: ""
  ADLS_CLIENT_ID: ""
  ADLS_CLIENT_SECRET: ""
---
# BFF (D-048): its own service principal on the app schema (SELECT on the published tables;
# SELECT, INSERT, UPDATE, DELETE on the user tables of deploy/sql/bff_user_tables.sql).
apiVersion: v1
kind: Secret
metadata:
  name: bff-secrets
  namespace: PLACEHOLDER_NAMESPACE
type: Opaque
stringData:
  BFF_SQL_CLIENT_ID: ""
  BFF_SQL_CLIENT_SECRET: ""
