[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uw-pipeline"
version = "0.1.0"
description = "Underwriting Intelligence data pipeline: SEC EDGAR + Alpha Vantage -> Azure SQL"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.0"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
uw-pipeline = "uw_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/uw_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["uw_pipeline"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
