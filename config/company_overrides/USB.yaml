# U.S. Bancorp files its 10-K as a wrapper; the text is the annual report (Exhibit 13).
# Section rules (D-060): from a `start` line to the first later `end` line, the longest such
# block (regexes, case-insensitive, whole lines): the table of contents repeats the headings.
sections:
  10K-7:
    start: "^Management.s Discussion and Analysis$"
    end: "^Controls and Procedures$"
  10K-1A:
    start: "^Risk Factors$"
    end: "^(Managing Committee|Management.s Discussion and Analysis)$"  # TOC: next entry
  10K-9A:
    start: "^Controls and Procedures$"
    end: "^(Report of Independent Registered Public Accounting Firm|Risk Factors$)"  # TOC: next entry
  10Q-I-2:
    start: "^Management.s Discussion and Analysis$"
    end: "^Controls and Procedures$"
  10Q-I-4:
    start: "^Controls and Procedures$"
    end: "^Consolidated Balance Sheet$"
