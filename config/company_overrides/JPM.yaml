# JPMorgan's 10-K/10-Q body uses its own headings. The "Item" index at the back only gives page
# numbers, so item-based splitting finds just a cross-reference for the MD&A. These rules locate
# the sections by their own headings: from the first `start` line to the first `end` line after
# it (regexes, case-insensitive, matched against whole lines).
sections:
  10K-7:
    start: "^Management.s discussion and analysis$"
    end: "^(Management.s report on internal control over financial reporting|Report of Independent Registered Public Accounting Firm)"
  10Q-I-2:
    start: "^Consolidated financial highlights"
    end: "^Consolidated statements of income"
