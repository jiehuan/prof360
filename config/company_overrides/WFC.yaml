# Wells Fargo files its 10-K as a wrapper; the text is the annual report (Exhibit 13), whose
# MD&A is headed "Financial Review". The 10-Q uses the same heading.
# Section rules (D-060): from a `start` line to the first later `end` line, the longest such
# block (regexes, case-insensitive, whole lines): the table of contents repeats the headings.
sections:
  10K-7:
    start: "^Financial Review$"
    end: "^Risk Factors$"
  10K-1A:
    start: "^Risk Factors$"
    end: "^Controls and Procedures$"
  10K-9A:
    start: "^Controls and Procedures$"
    end: "^Report of Independent Registered Public Accounting Firm"
  10Q-I-2:
    start: "^Financial Review$"
    end: "^Risk Factors$"
  10Q-I-4:
    start: "^Controls and Procedures$"
    end: "^Financial Statements$"
