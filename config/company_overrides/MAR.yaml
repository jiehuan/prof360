# Marriott-specific concepts and metrics. Fee revenues are dimensional facts
# (srt:ProductOrServiceAxis = mar:FeeServiceMember), read from each filing's XBRL instance.
concepts:
  gross_fee_revenue:
    note: "Marriott's fee revenues are dimensional facts (fee services member of the product-or-service axis)."
    tags:
      - tag: mar:RevenuesGrossOfCapitalizedContractCostAmortization
        dims: {srt:ProductOrServiceAxis: mar:FeeServiceMember}
      # Spelled with a lower-case "of" in filings before 2023.
      - tag: mar:RevenuesGrossofCapitalizedContractCostAmortization
        dims: {srt:ProductOrServiceAxis: mar:FeeServiceMember}
  net_fee_revenue:
    note: "Revenue of the fee services member: gross fees less amortization of contract investments."
    tags:
      - tag: us-gaap:Revenues
        dims: {srt:ProductOrServiceAxis: mar:FeeServiceMember}
  # Marriott reports "Depreciation, amortization, and other" under its own tag since 2015.
  d_and_a:
    note: "Marriott reports \"Depreciation, amortization, and other\" under its own tag since 2015."
    tags:
      - us-gaap:DepreciationDepletionAndAmortization
      - mar:DepreciationAmortizationAndOther

metrics:
  - code: gross_fee_revenue
    display_name: Gross Fee Revenues
    subtitle: "Base management, franchise and incentive fees from hotels"
    section: financial
    unit: USD
    formula: gross_fee_revenue
  - code: net_fee_revenue
    display_name: Net Fee Revenues
    subtitle: "Gross fee revenue less amortization of contract investments"
    section: financial
    unit: USD
    formula: net_fee_revenue
