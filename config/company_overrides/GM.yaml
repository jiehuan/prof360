# General Motors tags its interest expense by business (gm:BusinessGroupAxis), so the default
# tags find only cash interest paid (InterestPaidNet), most of it GM Financial's. GM Financial's
# interest is an operating cost already deducted from operating income; dividing by it again
# gave 0.44x for FY2025. Interest expense here is the income statement's "Automotive interest
# expense" (D-087), read from each filing's XBRL instance.
concepts:
  interest_expense:
    note: "Automotive interest expense only, from the income statement (GM's business-group axis). GM Financial's interest is an operating cost already deducted from operating income, so it is left out (D-087)."
    tags:
      - tag: us-gaap:InterestExpenseNonoperating
        dims: {gm:BusinessGroupAxis: gm:AutomotiveMember}
