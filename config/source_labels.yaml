# Document roles other than the primary document.
roles:
  EX-99.1: "Earnings Release (Exhibit 99.1)"

# How a value was obtained (metric_value.derivation), used in the metric methodology text.
derivations:
  REPORTED: "Reported in XBRL"
  DERIVED: "Derived from XBRL (e.g. Q4 = full year − nine months)"
  COMPUTED: "Computed from reported XBRL values"
  LLM_EXTRACTED: "Extracted from filing text"
  PRELIMINARY: "Preliminary, from the earnings release (10-Q/10-K not yet filed)"
  MARKET: "Computed from daily share prices and consensus EPS (Alpha Vantage)"
  FORM4: "Summed from insiders' Form 4 filings"

# XBRL concepts (concept_map.yaml) that are not metrics themselves, as written in formulas.
concepts:
  d_and_a: "Depreciation & Amortization"
  debt_total_reported: "Total Debt as reported"
  ltd_current: "Current Portion of Long-Term Debt"
  ltd_noncurrent: "Long-Term Debt (noncurrent)"
  ltdcl_current: "Current Long-Term Debt and Finance Leases"
  ltdcl_noncurrent: "Long-Term Debt and Finance Leases (noncurrent)"
  short_term_borrowings: "Short-Term Borrowings"
  pretax_income: "Pre-tax Income"
  dividends_paid: "Dividends Paid"
