# Readable names for section codes (Phase 8, decisions D-036). Used to build source titles shown
# in the front-end detail modals, e.g.
#   "Marriott International, Inc. 10-Q filed 2026-07-30 · Item 2. MD&A"
# A code missing here is shown as the code itself.

