# MVP company list: one company per SIC code (see docs/decisions.md D-007).
# `cik` is pinned and authoritative. Tickers get reassigned, so they are only checked against
# SEC's ticker list and a mismatch is logged, never followed.
# `industry: GROUP` with `industry_reason: "..."` puts a company in an industry group of
# industry_groups.yaml regardless of its SIC code (D-049; guide: docs/CONFIGURATION.md).
companies:
  - ticker: MAR
    cik: 1048286
    display_name: Marriott International
    news_aliases: ["Marriott"]
  - ticker: LUV
    cik: 92380
    display_name: Southwest Airlines
    news_aliases: ["Southwest Airlines", "Southwest"]
  - ticker: F
    cik: 37996
    display_name: Ford Motor Company
    news_aliases: ["Ford"]
  - ticker: PFE
    cik: 78003
    display_name: Pfizer
    news_aliases: ["Pfizer"]
  - ticker: JPM
    cik: 19617
    display_name: JPMorgan Chase
    news_aliases: ["JPMorgan", "JP Morgan", "J.P. Morgan", "Chase", "Jamie Dimon"]
  - ticker: M
    cik: 794367
    display_name: Macy's
    news_aliases: ["Macy's", "Macy’s", "Macys"]
  - ticker: LUMN
    cik: 18926
    display_name: Lumen Technologies
    news_aliases: ["Lumen"]
  - ticker: SKYD
    cik: 2041610
    display_name: Skydance Corp
    news_aliases: ["Skydance", "Paramount"]
    former_tickers: [PARA, PSKY]
    # Alpha Vantage files news before the 2026-10-06 rename and all earnings call transcripts
    # under PSKY (checked 2026-10-13); PARA now belongs to another company.
    av_symbols: [SKYD, PSKY]
    predecessor_ciks: [813828]  # Paramount Global; stopped filing after the Aug 2025 merger
    # Successor periods start 2025-08-08. Earlier values in this registrant's filings are
    # predecessor (Paramount Global) figures and are excluded (decisions D-012).
    history_start: 2025-08-08
    notes: >-
      Front end shows this company as PARA. Since 2025 SEC's ticker list maps PARA to an
      unrelated company (Banzai International, CIK 1826011). The successor registrant was named
      Paramount Skydance Corp (PSKY) and was renamed Skydance Corp (SKYD) on 2026-10-06.
