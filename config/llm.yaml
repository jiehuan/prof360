# LLM settings for rule + LLM voting on judgment signals (decisions D-028).
# The extractor reads every in-scope section. When it disagrees with the rules, the tie-breaker
# answers the same question independently and the majority of the three votes wins.
#
# Provider (D-039): Azure OpenAI through the AXA XL gateway (config/securegpt.yaml,
# SECUREGPT_* vars). `default_provider` names the profile; LLM_PROVIDER overrides it.
# The model is part of every cache key: each profile keeps its own cached results, and switching
# re-uses them; a new model runs all LLM tasks again once.
# `synthesis` is the model of the company-level tasks (config/insights.yaml).
default_provider: securegpt
providers:
  securegpt:
    # Models (D-051): gpt-6-luna for routine calls, gpt-6-sol as tie-breaker and for synthesis
    # (was gpt-5-nano / gpt-5-mini). max_tokens includes reasoning tokens, hence the higher
    # limits.
    extractor: {model: gpt-6-luna-2026-09-22, effort: low, max_tokens: 16000}
    tiebreaker: {model: gpt-6-sol-2026-09-22, effort: high, max_tokens: 32000}
    synthesis: {model: gpt-6-sol-2026-09-22, effort: high, max_tokens: 32000}
    # SecureGPT price list, per million tokens (input, output): run statistics and the daily
    # budget (LLM_DAILY_BUDGET). A model without a price counts as free (the run logs a warning).
    pricing_currency: EUR
    pricing:
      # D-051, in USD: gpt-6-sol as given by the user; gpt-6-luna provisional, a third-party
      # list price (TO VERIFY against SecureGPT's own).
      gpt-6-luna-2026-09-22: [0.10, 0.50]
      gpt-6-sol-2026-09-22: [2.00, 10.00]
      gpt-5-nano-2025-08-07: [0.052, 0.378]
      gpt-5-mini-2025-08-07: [0.240, 1.889]
    # Phase 15i (D-050, D-051): each deployment's quota, shared by the parallel workers of a
    # stage (config/jobs.yaml `parallel`); a request reserves its input plus max_tokens, as
    # Azure counts it. 500K tokens per minute per deployment; requests per minute not limited
    # here until the gateway team gives a number (429s are retried and pause the model).
    rate_limits:
      gpt-6-luna-2026-09-22: {tpm: 500000}
      gpt-6-sol-2026-09-22: {tpm: 500000}
    # task_max_tokens: lower max_tokens per task, from this profile's own llm_call
    # output_tokens (reasoning included); see docs/OPERATIONS.md.

prompt_version: signals_v1
# The tie-breaker sees both claims and their evidence and rules on the text (D-028).
tiebreak_prompt_version: tiebreak_v2
# Longer inputs are not sent (never silently truncated); those documents stay rule-only.
max_input_chars: 120000
# Model calls of one company asked at a time where they do not depend on each other (D-062:
# insights' behavioral and strategic syntheses, textmetrics' document reads). The per-model
# `rate_limits` still apply across all of them.
company_calls: 3

# Judgment questions ("topics") asked of each section; only these sections are sent.
# Answers: leadership:* -> departure | appointment | succession (both) | none; listing -> adverse |
# voluntary_transfer | none; the rest -> present | none.
topics:
  "8K-5.02": ["leadership:CEO", "leadership:CFO"]
  "8K-3.01": ["listing"]
  "10K-AUDIT": ["going_concern"]
  "10K-9A": ["material_weakness", "controls_not_effective"]
  "10Q-I-4": ["material_weakness", "controls_not_effective"]
