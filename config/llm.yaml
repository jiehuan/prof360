# LLM settings for rule + LLM voting on judgment signals (decisions D-028).
# The extractor reads every in-scope section. When it disagrees with the rules, the tie-breaker
# answers the same question independently and the majority of the three votes wins.
#
# Providers (D-039). One complete model profile per provider; the active one is
# `default_provider`, or the LLM_PROVIDER environment variable when set (e.g. Claude for
# development off the corporate network, SecureGPT on it):
#   securegpt = Azure OpenAI through the AXA XL gateway (config/securegpt.yaml, SECUREGPT_* vars)
#   anthropic = Claude API (ANTHROPIC_API_KEY)
#   runware   = Runware gateway, OpenAI-compatible (config/runware.yaml, RUNWARE_API_KEY, D-047):
#               DeepSeek reads first, Claude Haiku is the independent second model
# The model is part of every cache key: each profile keeps its own cached results, and switching
# re-uses them; a new model runs all LLM tasks again once.
# `synthesis` is the model of the company-level tasks (config/insights.yaml).
default_provider: securegpt
providers:
  securegpt:
    # Models (D-051): gpt-6-luna for routine calls, gpt-6-sol as tie-breaker and for synthesis
    # (was gpt-5-nano / gpt-5-mini). max_tokens includes reasoning tokens, hence the higher
    # limits.
    extractor: {model: gpt-6-luna-2026-09-22, effort: low, max_tokens: 16000}
    tiebreaker: {model: gpt-6-sol-2026-09-22, effort: high, max_tokens: 32000}
    synthesis: {model: gpt-6-sol-2026-09-22, effort: high, max_tokens: 32000}
    # SecureGPT price list, per million tokens (input, output): run statistics and the daily
    # budget (LLM_DAILY_BUDGET). A model without a price counts as free (the run logs a warning).
    pricing_currency: EUR
    pricing:
      # D-051, in USD: gpt-6-sol as given by the user; gpt-6-luna provisional, a third-party
      # list price (TO VERIFY against SecureGPT's own).
      gpt-6-luna-2026-09-22: [0.10, 0.50]
      gpt-6-sol-2026-09-22: [2.00, 10.00]
      gpt-5-nano-2025-08-07: [0.052, 0.378]
      gpt-5-mini-2025-08-07: [0.240, 1.889]
    # Phase 15i (D-050, D-051): each deployment's quota, shared by the parallel workers of a
    # stage (config/jobs.yaml `parallel`); a request reserves its input plus max_tokens, as
    # Azure counts it. 500K tokens per minute per deployment; requests per minute not limited
    # here until the gateway team gives a number (429s are retried and pause the model).
    rate_limits:
      gpt-6-luna-2026-09-22: {tpm: 500000}
      gpt-6-sol-2026-09-22: {tpm: 500000}
    # task_max_tokens: lower max_tokens per task, from this profile's own llm_call
    # output_tokens (reasoning included); see docs/OPERATIONS.md.
  anthropic:
    extractor: {model: claude-haiku-5-5, effort: low, max_tokens: 8000}
    tiebreaker: {model: claude-sonnet-5-5, effort: high, max_tokens: 16000}
    # Largest synthesis output so far 11,433 tokens (2026-10-15); headroom for more news.
    synthesis: {model: claude-sonnet-5-5, effort: high, max_tokens: 32000}
    pricing_currency: USD
    pricing:
      claude-haiku-5-5: [0.1, 0.5]    # prompts <= 100K tokens; longer prompts 0.5 / 2.5
      claude-sonnet-5-5: [2.0, 10.0]
      claude-opus-5-5: [4.0, 20.0]
    # Phase 15i: max_tokens per task, about twice the largest output (thinking included) in
    # llm_call on 2026-10-18; the model's own max_tokens applies when lower. Not in the cache
    # key: changing a value does not repeat cached calls.
    task_max_tokens:
      signals: 4000            # largest 750
      tiebreak: 4000           # 477
      transcript_tone: 3000    # 942
      news_events: 4000        # 1,367
      news_relevance: 6000     # 2,134
      news_risk: 8000          # 3,139
      board: 8000              # 3,454
      activity_summary: 8000   # 3,412
      table_metrics: 6000      # 2,393
      text_metrics: 12000      # 4,703
      legal_matters: 12000     # 5,164
      loan_book: 12000         # 5,353
      metric_detail: 14000     # 5,954
      followups: 14000         # 6,492
      behavioral: 18000        # 7,967
      key_insights: 22000      # 9,462
  anthropic_haiku:
    # Development runs from Phase 16 (user decision, 2026-10-18): Claude Haiku 5.5 in every
    # role, for cost. Extractor and tie-breaker differ in effort only, so the two reads of a
    # dual check are the same model (less independent than with Sonnet as second model).
    extractor: {model: claude-haiku-5-5, effort: low, max_tokens: 8000}
    tiebreaker: {model: claude-haiku-5-5, effort: high, max_tokens: 16000}
    synthesis: {model: claude-haiku-5-5, effort: high, max_tokens: 32000}
    pricing_currency: USD
    pricing:
      claude-haiku-5-5: [0.1, 0.5]    # prompts <= 100K tokens; longer prompts 0.5 / 2.5
  runware:
    # Runware model ids. Extractor and tie-breaker are different models, so dual checks and
    # signal votes stay two independent reads.
    # max_tokens includes DeepSeek's reasoning tokens; 8000 cut off long text-metric answers
    # (2026-10-15). The model allows far more; only tokens produced are billed.
    extractor: {model: "deepseek:v4@flash", effort: low, max_tokens: 32000}
    tiebreaker: {model: "anthropic:claude@haiku-5.5", effort: high, max_tokens: 16000}
    synthesis: {model: "anthropic:claude@sonnet-5.5", effort: high, max_tokens: 32000}
    pricing_currency: USD
    # TO VERIFY against the cost Runware reports on the first calls (scripts/runware_smoke.py).
    # DeepSeek: third-party listing of Runware's price; Claude: Anthropic list prices.
    pricing:
      "deepseek:v4@flash": [0.08, 0.15]
      "anthropic:claude@haiku-5.5": [0.1, 0.5]
      "anthropic:claude@sonnet-5.5": [2.0, 10.0]
  runware_luna:
    # Experiment (2026-10-15): one model in every role, no second opinion. The tie-breaker is
    # the extractor's exact spec (model + effort), so a dual check's second read comes from the
    # cache and agrees with the first; only signal disagreements are judged again (same model).
    extractor: {model: "openai:gpt@6-luna", effort: medium, max_tokens: 32000}
    tiebreaker: {model: "openai:gpt@6-luna", effort: medium, max_tokens: 32000}
    synthesis: {model: "openai:gpt@6-luna", effort: high, max_tokens: 32000}
    pricing_currency: USD
    # TO VERIFY: third-party listings (eesel.ai, anotherwrapper.com, 2026-10-11), not Runware.
    pricing:
      "openai:gpt@6-luna": [0.10, 0.50]

prompt_version: signals_v1
# The tie-breaker sees both claims and their evidence and rules on the text (D-028).
tiebreak_prompt_version: tiebreak_v2
# Longer inputs are not sent (never silently truncated); those documents stay rule-only.
max_input_chars: 120000
# Model calls of one company asked at a time where they do not depend on each other (D-062:
# insights' behavioral and strategic syntheses, textmetrics' document reads). The per-model
# `rate_limits` still apply across all of them.
company_calls: 3

# Judgment questions ("topics") asked of each section; only these sections are sent.
# Answers: leadership:* -> departure | appointment | succession (both) | none; listing -> adverse |
# voluntary_transfer | none; the rest -> present | none.
topics:
  "8K-5.02": ["leadership:CEO", "leadership:CFO"]
  "8K-3.01": ["listing"]
  "10K-AUDIT": ["going_concern"]
  "10K-9A": ["material_weakness", "controls_not_effective"]
  "10Q-I-4": ["material_weakness", "controls_not_effective"]
