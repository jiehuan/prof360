# Rule-based signals (no LLM). Categories follow the front end's Strategic & Risk Insights:
# "Governance & Leadership", "Risk & Legal", "Event Signals". Severity: Info | Warning | Critical.

# 8-K item number -> event signal (PLAN §5.4). Items not listed produce no signal.
eight_k_items:
  "1.01": {category: Event Signals, subcategory: Material Agreement, severity: Info,
           title: Entered into a material definitive agreement}
  "1.02": {category: Event Signals, subcategory: Material Contracts, severity: Info,
           title: Terminated a material definitive agreement}
  # Material cybersecurity incident, required since December 2023 (Phase 15d).
  "1.05": {category: Risk & Legal, subcategory: Cybersecurity, severity: Warning,
           title: Disclosed a material cybersecurity incident}
  "1.03": {category: Event Signals, subcategory: Bankruptcy, severity: Critical,
           title: Bankruptcy or receivership}
  "2.01": {category: Event Signals, subcategory: M&A, severity: Info,
           title: Completed an acquisition or disposition of assets}
  "2.04": {category: Event Signals, subcategory: Debt, severity: Warning,
           title: Triggering event accelerating a financial obligation}
  "2.06": {category: Event Signals, subcategory: Impairment, severity: Warning,
           title: Material impairment}
  "3.01": {category: Event Signals, subcategory: Listing, severity: Warning,
           title: Notice of delisting or failure to meet a listing rule,
           # A voluntary exchange transfer is filed under the same item but is not adverse.
           downgrade: {pattern: 'voluntar\w* (?:to )?(?:de-?list|withdraw|transfer)|transfer of listing from',
                       severity: Info, subcategory: Listing Transfer,
                       title: Voluntary transfer of stock exchange listing}}
  "4.01": {category: Governance & Leadership, subcategory: Auditor Change, severity: Warning,
           title: Change in the company's certifying accountant}
  "4.02": {category: Event Signals, subcategory: Restatement, severity: Critical,
           title: Previously issued financial statements should no longer be relied upon}
  "5.02": {category: Governance & Leadership, subcategory: Leadership Change, severity: Info,
           title: "Director or officer departure, election or appointment"}

# 8-K items whose document body is downloaded (for evidence snippets and the 5.02 rules).
fetch_body_items: ["1.03", "1.05", "2.04", "2.06", "3.01", "4.01", "4.02", "5.02"]

# Ownership filings others make about the company (Phase 15d). EDGAR lists them under the
# company's own submissions; the documents stage registers them (metadata only). A Schedule
# 13D means an investor with 5%+ intends to influence the company (activism); amendments update
# an existing stake. Rule ids: 13d, 13d_amendment.
ownership_forms:
  "SCHEDULE 13D": &activist {category: Governance & Leadership, subcategory: Activist Investor,
                             severity: Warning, title: An investor reported a 5%+ stake with intent to influence (Schedule 13D)}
  "SC 13D": *activist
  "SCHEDULE 13D/A": &activist_amendment {category: Governance & Leadership, subcategory: Activist Investor,
                                         severity: Info, title: An activist investor amended its Schedule 13D}
  "SC 13D/A": *activist_amendment

# Item 5.02: escalate when the text names the CEO or CFO.
leadership:
  roles:
    CEO: '\b(chief executive officer|principal executive officer)\b'
    CFO: '\b(chief financial officer|principal financial officer)\b'
  # Sentences that mention a role without a change of that role at this company.
  exclude: '\b(continues? to serve|will continue|previously served|formerly served|prior to joining|served as .{0,80} (?:at|of) (?!the company|the firm|the corporation))'
  # A role followed by "of <name>" belongs to another entity or a business unit unless the name
  # is the company itself.
  own_entity: '(?:the )?(?:company|firm|corporation|registrant)\b'
  # The change verb must be within this many characters of the role mention.
  proximity: 100
  departure: '\b(resign\w*|retire\w*|depart\w*|leav(?:e|es|ing)\b|terminat\w*|step(?:ped|ping|s)? down|will not stand for re-?election|separat\w+ from)\b'
  appointment: '\b(appoint\w*|elect\w*|nam(?:ed|es) .{0,40}as|promot\w*|succeed\w*)\b'
  # severity by kind of change; succession = a departure and an appointment to the same role
  severity:
    departure: Warning
    succession: Warning
    appointment: Info

# Keyword rules over filing sections. `sections` are section-code prefixes. A match is dropped
# when its sentence also matches `exclude`. `industries: [GROUP, ...]` limits a rule to those
# industry groups (default: every group). Guide: docs/CONFIGURATION.md.
keywords:
  - id: going_concern
    category: Risk & Legal
    subcategory: Going Concern
    severity: Critical
    title: Auditor's report raises substantial doubt about going concern
    sections: ["10K-AUDIT"]
    pattern: 'substantial doubt about (?:the \w+.s|its|our) ability to continue as a going concern'
    exclude: '\b(no|not|alleviat\w*)\b'
  - id: material_weakness
    category: Risk & Legal
    subcategory: Internal Controls
    severity: Warning
    title: Material weakness in internal control over financial reporting
    sections: ["10K-9A", "10Q-I-4"]
    pattern: '(identified|identification of|existence of|remediat\w+|disclosed) (?:a |the |certain |two |three )?material weakness(?:es)?'
    exclude: '\b(no|not|did not|has not|have not|none)\b'
  - id: controls_not_effective
    category: Risk & Legal
    subcategory: Internal Controls
    severity: Warning
    title: Controls and procedures concluded not effective
    sections: ["10K-9A", "10Q-I-4"]
    pattern: '(internal control over financial reporting|disclosure controls and procedures) (?:was|were) not effective'
  - id: restatement
    category: Event Signals
    subcategory: Restatement
    severity: Warning
    title: Financial statements restated
    sections: ["10K-7", "10K-8", "10K-9A", "10Q-I-1", "10Q-I-2", "10Q-I-4"]
    pattern: '(restatement of (?:our |the |its )?(?:previously issued|prior[- ]period|consolidated) financial statements|have been restated to correct|\(as restated\))'

# Signals derived from computed metrics (latest quarter).
metrics:
  negative_equity:
    category: Risk & Legal
    subcategory: Balance Sheet
    severity: Warning
    title: Stockholders' equity is negative; debt-to-equity is not meaningful
  buybacks_with_negative_equity:
    category: Governance & Leadership
    subcategory: Capital Allocation
    severity: Info
    title: Share repurchases continue while equity is negative
    # trailing four quarters of buybacks must exceed this (USD)
    min_buybacks_ttm: 0
  # Pay versus performance from the proxy statement (decisions D-042): say-on-pay and
  # compensation litigation risk.
  pay_vs_performance:
    category: Governance & Leadership
    subcategory: Executive Compensation
    severity: Warning
    title: CEO pay rose while shareholder return fell
    min_pay_growth: 0.25   # CEO total compensation, year on year
  # Board composition from the proxy statement (D-045); facts both models agreed on only.
  ceo_chair_without_lead_director:
    category: Governance & Leadership
    subcategory: Board Structure
    severity: Warning
    title: CEO is also chair, with no lead independent director
  board_independence:
    category: Governance & Leadership
    subcategory: Board Structure
    severity: Warning
    title: Less than two-thirds of the board is independent
    min_ratio: 0.667
  # Phase 15f (board_v2): more than one class of common stock with unequal votes (control
  # concentrated with a family or founders), and the auditor's non-audit work.
  dual_class_shares:
    category: Governance & Leadership
    subcategory: Board Structure
    severity: Info
    title: Dual-class share structure
  non_audit_fees:
    category: Governance & Leadership
    subcategory: Auditor
    severity: Warning
    title: Non-audit fees are a large share of fees paid to the auditor
    min_share: 0.5         # (audit-related + tax + other) / total fees


# Market signals (Phase 15a), from the market stage's daily prices (adjusted closes) and
# earnings estimates. Rule ids: stock_drop, earnings_miss_drop.
market:
  benchmark: SPY
  lookback_days: 1095        # three years of events
  stock_drop:
    category: Event Signals
    subcategory: Stock Drop
    severity: Warning
    title: Shares fell 10% or more in a day, well beyond the market
    min_drop: 0.10           # the day's return is at most -10% ...
    min_excess: 0.08         # ... and at least 8 points below the benchmark's that day
  earnings_miss_drop:
    category: Event Signals
    subcategory: Earnings Miss
    severity: Warning
    title: Shares fell after an earnings miss
    days: 3                  # trading days after the report
    min_drop: 0.08           # fall from the close before the report


# Insider selling (Phase 15b), from the officers' and directors' Form 4 transactions. A cluster
# is `min_insiders` different people selling on the open market within `window_days`; sales
# under a Rule 10b5-1 plan are left out (pre-scheduled). Warning when a stock drop or an
# earnings-miss drop follows within `escalate_days`. Rule id: insider_cluster_selling.
insiders:
  insider_cluster_selling:
    category: Governance & Leadership
    subcategory: Insider Trading
    severity: Info
    title: Several insiders sold shares on the open market within 30 days
    min_insiders: 3
    window_days: 30
    escalate_days: 90
    lookback_days: 1095

# Litigation and regulatory matters (Phase 15e) from the legal stage: matters both models read
# the same way from the latest 10-K and later 10-Qs. A signal for a matter still disclosed (in a
# filing within `active_days`) that began within `lookback_days`, or is open with no start
# date given; dismissed and closed matters raise none. Rule ids: legal_<type>.
legal:
  lookback_days: 730
  active_days: 400
  securities_class_action:
    category: Risk & Legal
    subcategory: Securities Litigation
    severity: Critical
    title: Securities class action
  derivative:
    category: Risk & Legal
    subcategory: Shareholder Litigation
    severity: Warning
    title: Shareholder derivative suit
  regulatory_investigation:
    category: Risk & Legal
    subcategory: Regulatory Investigation
    severity: Warning
    title: Government investigation
  enforcement:
    category: Risk & Legal
    subcategory: Regulatory Enforcement
    severity: Warning
    title: Government enforcement action
  wells_notice:          # an investigation in which the company received a Wells notice
    category: Risk & Legal
    subcategory: Regulatory Investigation
    severity: Critical
    title: Wells notice received

# A metric crossing a threshold in its latest quarter (period: Q) or fiscal year (FY), in stored
# units (fraction 0.05 = 5%, ratio 1.2 = 1.2x, USD); N/M values never fire (D-049). Example:
#   - id: thin_liquidity
#     category: Risk & Legal
#     subcategory: Liquidity & Leverage
#     severity: Warning
#     title: Current ratio below 1.0
#     metric: current_ratio
#     op: "<"                 # < <= > >=
#     value: 1.0
#     period: Q
#     industries: [RETAIL]    # optional
thresholds:
  # Phase 15c: debt due within a year exceeds cash plus a year of operating cash flow.
  - id: near_term_refinancing
    category: Risk & Legal
    subcategory: Liquidity & Leverage
    severity: Warning
    title: Debt due within a year exceeds cash plus operating cash flow
    metric: near_term_debt_coverage
    op: ">"
    value: 1.0
    period: FY

  # Phase 15c: Altman Z-score (non-financial companies only; uses the market stage's market cap).
  - id: altman_distress
    category: Risk & Legal
    subcategory: Balance Sheet
    severity: Warning
    title: Altman Z-score in the distress zone (below 1.81)
    metric: altman_z
    op: "<"
    value: 1.81
    period: FY

  # Phase 17c (D-058): less than a year of cash at the last four quarters' burn rate. Only
  # companies with the clinical_stage trait track the metric.
  - id: short_cash_runway
    category: Risk & Legal
    subcategory: Liquidity & Leverage
    severity: Warning
    title: Cash runway under 12 months at the current burn rate
    metric: cash_runway_months
    op: "<"
    value: 12
    period: Q
