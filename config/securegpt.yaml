# SecureGPT gateway (Azure OpenAI behind the AXA XL API gateway), Phase 11, decisions D-039.
# Non-secret settings only. Credentials come from the environment:
#   SECUREGPT_CLIENT_ID, SECUREGPT_CLIENT_SECRET, SECUREGPT_SUBSCRIPTION_KEY, SECUREGPT_ENV.
# Taken from the team's working client (professional-databricks utils/secure_gpt.py and
# config/main_config.cfg).

default_env: dv
environments:
  dv:
    token_url: https://gateway-dev.api.axaxl.com/axaonelogin/v1/as/token.oauth2
    base_url: https://gateway-dev.api.axaxl.com/securegptmodelhub/v1/providers/openai/deployments
  pp:
    token_url: https://gateway-preprod.api.axaxl.com/axaonelogin/v1/as/token.oauth2
    base_url: https://gateway-preprod.api.axaxl.com/securegptmodelhub/v1/providers/openai/deployments
  pr:
    # TO CONFIRM: production URLs follow the dv/pp pattern on gateway.api.axaxl.com.
    token_url: https://gateway.api.axaxl.com/axaonelogin/v1/as/token.oauth2
    base_url: https://gateway.api.axaxl.com/securegptmodelhub/v1/providers/openai/deployments

scope: "urn:grp:chatgpt"
# Chat completions with structured outputs (`json_schema`, strict) on every call. 2025-04-01-preview
# is the version the gateway lists for these deployments (D-051; was 2024-10-21).
api_version: "2025-04-01-preview"
# This api-version takes `reasoning_effort` for reasoning models; off until the smoke test
# (scripts/securegpt_smoke.py) shows the gateway passes it through.
send_reasoning_effort: false
# Model name used in config/llm.yaml and insights.yaml -> gateway deployment id.
deployments:
  gpt-6-luna-2026-09-22: gpt-6-luna-2026-09-22   # routine calls (extractor), D-051
  gpt-6-sol-2026-09-22: gpt-6-sol-2026-09-22     # tie-breaker and synthesis
  gpt-5-nano-2025-08-07: gpt-5-nano-2025-08-07   # previous models (D-039)
  gpt-5-mini-2025-08-07: gpt-5-mini-2025-08-07

timeout_sec: 300
max_attempts: 8
retry_statuses: [408, 429, 500, 502, 503, 504]
# Waits between attempts (seconds): Retry-After when the gateway sends it, otherwise
# exponential from `backoff_initial` up to `backoff_max`.
backoff_initial: 5
backoff_max: 300
