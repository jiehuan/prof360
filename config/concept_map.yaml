# Concept -> ordered XBRL tag candidates.
#
# Tags are picked PER PERIOD: for each fiscal period the first candidate that has a value wins,
# and the tag actually used is stored with every value. Companies switch tags over time
# (e.g. MAR InterestExpense -> InterestExpenseNonoperating in 2024), so picking one tag for
# all history would drop recent periods.
#
# A candidate is "taxonomy:Tag", or {tag: ..., dims: {Axis: Member}} for a dimensional fact.
# Non-standard taxonomies (company extensions such as mar:) and dimensional facts are not in
# SEC companyfacts and are read from each filing's XBRL instance instead.
#
# `by_group` replaces `tags` for companies in that industry group. Company files under
# company_overrides/ can replace any concept's tags for one company.

concepts:
  revenue:
    tags:
      - us-gaap:Revenues
      - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
      - us-gaap:SalesRevenueNet
      # Phase 17: revenue including excise and gaming taxes is some filers' only total (Valero,
      # Wynn Resorts since 2019).
      - us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax
    by_group:
      # Banks report "total net revenue" (net of interest expense). us-gaap:Revenues means
      # something different for JPM and stops in 2025, so mixing the two would distort growth.
      BANKS: [us-gaap:RevenuesNetOfInterestExpense, us-gaap:Revenues]
      # Phase 16: broker-dealers report net revenues; utilities total operating revenues
      # (regulated and unregulated). For BAC, C, COF, USB and BNY us-gaap:Revenues is net
      # revenue (net interest income + noninterest income).
      BROKER_DEALERS: [us-gaap:RevenuesNetOfInterestExpense, us-gaap:Revenues,
                       us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax]  # BLK 2025
      UTILITIES: [us-gaap:RegulatedAndUnregulatedOperatingRevenue, us-gaap:Revenues,
                  us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax]
  net_income:
    tags:
      - us-gaap:NetIncomeLoss
      - us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic
      - us-gaap:ProfitLoss
  operating_income:
    tags: [us-gaap:OperatingIncomeLoss]
  noninterest_income:
    tags: [us-gaap:NoninterestIncome]
  pretax_income:
    tags:
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
      - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
  d_and_a:
    tags:
      - us-gaap:DepreciationDepletionAndAmortization
      - us-gaap:DepreciationAndAmortization
      - us-gaap:DepreciationAmortizationAndAccretionNet
  # Phase 16: some report depreciation and intangible amortization separately (MSFT, ABBV).
  depreciation: {tags: [us-gaap:Depreciation, us-gaap:DepreciationNonproduction]}
  # Bank net revenue parts (bank_net_revenue).
  nii_parts: {tags: [us-gaap:InterestIncomeExpenseNet]}
  nonii_parts: {tags: [us-gaap:NoninterestIncome]}
  amortization_intangibles: {tags: [us-gaap:AmortizationOfIntangibleAssets]}
  cash:
    tags:
      - us-gaap:CashAndCashEquivalentsAtCarryingValue
      - us-gaap:CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
  short_term_investments:   # Phase 15c: liquidity beside cash (marketable securities)
    tags:
      - us-gaap:ShortTermInvestments
      - us-gaap:MarketableSecuritiesCurrent
      - us-gaap:OtherShortTermInvestments
  current_assets:
    tags: [us-gaap:AssetsCurrent]
  current_liabilities:
    tags: [us-gaap:LiabilitiesCurrent]
  # Debt is only ever summed within one tag family (see metrics.yaml total_debt).
  debt_total_reported:
    tags:
      - us-gaap:DebtAndCapitalLeaseObligations
      - us-gaap:LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities
      - us-gaap:DebtLongtermAndShorttermCombinedAmount   # Phase 16 (ORCL)
  # Phase 16: long-term debt including current maturities, and all current debt (commercial
  # paper and current maturities), each with their own siblings in total_debt.
  ltd_total: {tags: [us-gaap:LongTermDebt]}
  debt_current: {tags: [us-gaap:DebtCurrent]}
  ltdcl_noncurrent:
    tags: [us-gaap:LongTermDebtAndCapitalLeaseObligations]
  ltdcl_current:
    tags: [us-gaap:LongTermDebtAndCapitalLeaseObligationsCurrent]
  ltd_noncurrent:
    tags: [us-gaap:LongTermDebtNoncurrent]
  ltd_current:
    tags: [us-gaap:LongTermDebtCurrent]
  short_term_borrowings:
    tags: [us-gaap:ShortTermBorrowings, us-gaap:CommercialPaper]
  # Finance lease liabilities, added only to the LongTermDebt family, which excludes them
  # (the ...AndCapitalLeaseObligations family already includes them). Decisions D-046.
  finance_lease_liabilities:
    tags: [us-gaap:FinanceLeaseLiability]
  equity:
    tags:
      - us-gaap:StockholdersEquity
      - us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  interest_expense:
    tags:
      - us-gaap:InterestExpense
      - us-gaap:InterestExpenseNonoperating
      - us-gaap:InterestExpenseDebt
      - us-gaap:InterestAndDebtExpense
      # Phase 16: cash interest paid where no interest expense is tagged (CAT, GE, NEE keep it
      # in their own tags); close to the expense for most issuers.
      - us-gaap:InterestPaidNet
  operating_cash_flow:
    tags: [us-gaap:NetCashProvidedByUsedInOperatingActivities,
           us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations]  # DIS FY2024
  capex:
    tags:
      - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
      - us-gaap:PaymentsToAcquireProductiveAssets
  buybacks:
    tags: [us-gaap:PaymentsForRepurchaseOfCommonStock,
           us-gaap:StockRepurchasedDuringPeriodValue,          # Phase 16 (MS)
           us-gaap:TreasuryStockValueAcquiredCostMethod]
  dividends_paid:
    tags: [us-gaap:PaymentsOfDividends, us-gaap:PaymentsOfDividendsCommonStock]

  # -- Bank regulatory capital (decisions D-042) ------------------------------------------------
  # Actual ratios, unit pure. Banks tag them per methodology (Standardized / Advanced) with
  # members they name themselves, so the candidates are in company_overrides/; without one the
  # text extraction stays the source. Regulatory floors and buffers share unit, period and
  # dimensions with the actual ratios and are refused here (registry check).
  cet1_ratio: {tags: [], unit: pure}
  tier1_ratio: {tags: [], unit: pure}
  total_capital_ratio: {tags: [], unit: pure}
  # Retained loans; the loan book by class must add up to no more than this.
  total_loans:
    tags:
      - us-gaap:FinancingReceivableExcludingAccruedInterestBeforeAllowanceForCreditLoss
      - us-gaap:LoansAndLeasesReceivableNetOfDeferredIncome

  # -- Pay versus performance (proxy statement DEF 14A, `ecd` taxonomy, decisions D-042) --------
  # PEO = principal executive officer. TSR = value of a fixed $100 investment.
  ceo_total_comp: {tags: [ecd:PeoTotalCompAmt]}
  ceo_comp_actually_paid: {tags: [ecd:PeoActuallyPaidCompAmt]}
  neo_avg_total_comp: {tags: [ecd:NonPeoNeoAvgTotalCompAmt]}
  tsr_value_100: {tags: [ecd:TotalShareholderRtnAmt]}
  peer_tsr_value_100: {tags: [ecd:PeerGroupTotalShareholderRtnAmt]}

  # -- Bank profitability and credit (decisions D-043) --------------------------------------------
  total_assets: {tags: [us-gaap:Assets]}
  net_interest_income: {tags: [us-gaap:InterestIncomeExpenseNet]}
  allowance_for_loan_losses:
    tags:
      - us-gaap:FinancingReceivableAllowanceForCreditLossExcludingAccruedInterest
      - us-gaap:FinancingReceivableAllowanceForCreditLosses
  # Remaining performance obligations (ASC 606): contracted revenue not yet recognised.
  rpo: {tags: [us-gaap:RevenueRemainingPerformanceObligation]}
  # Reporting quality and solvency (Phase 15c).
  total_liabilities: {tags: [us-gaap:Liabilities]}
  retained_earnings: {tags: [us-gaap:RetainedEarningsAccumulatedDeficit]}
  receivables:
    tags: [us-gaap:AccountsReceivableNetCurrent, us-gaap:ReceivablesNetCurrent,
           us-gaap:AccountsNotesAndLoansReceivableNetCurrent]
  inventory:
    tags: [us-gaap:InventoryNet,
           us-gaap:InventoryNetOfAllowancesCustomerAdvancesAndProgressBillings,  # BA
           us-gaap:PublicUtilitiesInventory]                                     # utilities
  cost_of_revenue:
    tags: [us-gaap:CostOfGoodsAndServicesSold, us-gaap:CostOfRevenue, us-gaap:CostOfGoodsSold]
  goodwill: {tags: [us-gaap:Goodwill]}
  goodwill_impairment: {tags: [us-gaap:GoodwillImpairmentLoss]}
  sbc:
    tags: [us-gaap:ShareBasedCompensation, us-gaap:AllocatedShareBasedCompensationExpense]
  diluted_shares:
    unit: shares
    tags: [us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding]
  # Shares outstanding on the filing's cover page (dated a few weeks after the period end);
  # the market stage multiplies the period-end price by it (Phase 15a).
  cover_shares_outstanding:
    unit: shares
    tags: [dei:EntityCommonStockSharesOutstanding]
  # Scheduled repayments of long-term debt as of the fiscal year-end (10-K note).
  # Fallback for the next twelve months: the current portion of long-term debt on the balance
  # sheet (the same amount; most companies stopped tagging the maturity schedule).
  debt_due_1y:
    tags: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInNextTwelveMonths,
           us-gaap:LongTermDebtCurrent, us-gaap:LongTermDebtAndCapitalLeaseObligationsCurrent]
  debt_due_2y: {tags: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearTwo]}
  debt_due_3y: {tags: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearThree]}
  debt_due_4y: {tags: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFour]}
  debt_due_5y: {tags: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFive]}
  debt_due_after_5y: {tags: [us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalAfterYearFive]}
  # Industry modules (Phase 16, D-052).
  research_development:
    tags: [us-gaap:ResearchAndDevelopmentExpense,
           us-gaap:ResearchAndDevelopmentExpenseExcludingAcquiredInProcessCost,
           us-gaap:ResearchAndDevelopmentExpenseSoftwareExcludingAcquiredInProcessCost]
  gross_profit: {tags: [us-gaap:GrossProfit]}
  # Contract liabilities (deferred revenue) on the balance sheet.
  deferred_revenue:
    tags: [us-gaap:ContractWithCustomerLiabilityCurrent, us-gaap:DeferredRevenueCurrent,
           us-gaap:ContractWithCustomerLiability]
  deposits: {tags: [us-gaap:Deposits]}
  afs_unrealized_loss:
    tags: [us-gaap:AvailableForSaleDebtSecuritiesGrossUnrealizedLoss,
           us-gaap:AvailableForSaleSecuritiesGrossUnrealizedLoss]
  htm_unrecognized_loss:
    tags: [us-gaap:HeldToMaturitySecuritiesAccumulatedUnrecognizedHoldingLoss,
           us-gaap:HeldToMaturitySecuritiesUnrecognizedHoldingLoss]
  net_investment_income: {tags: [us-gaap:NetInvestmentIncome]}
  warranty_total: {tags: [us-gaap:ProductWarrantyAccrual, us-gaap:StandardProductWarrantyAccrual]}
  warranty_current: {tags: [us-gaap:ProductWarrantyAccrualClassifiedCurrent]}
  warranty_noncurrent: {tags: [us-gaap:ProductWarrantyAccrualNoncurrent]}
  # Non-current pension and retiree-benefit liabilities on the balance sheet (the funded
  # status is tagged by plan, not as one total).
  pension_liability:
    tags: [us-gaap:PensionAndOtherPostretirementDefinedBenefitPlansLiabilitiesNoncurrent,
           us-gaap:PensionAndOtherPostretirementAndPostemploymentBenefitPlansLiabilitiesNoncurrent,
           us-gaap:DefinedBenefitPensionPlanLiabilitiesNoncurrent]
  regulatory_assets: {tags: [us-gaap:RegulatoryAssetsNoncurrent]}
  # Industry modules (Phase 17, D-055).
  env_accrual: {tags: [us-gaap:AccrualForEnvironmentalLossContingencies]}
  env_accrual_current: {tags: [us-gaap:AccruedEnvironmentalLossContingenciesCurrent]}
  env_accrual_noncurrent: {tags: [us-gaap:AccruedEnvironmentalLossContingenciesNoncurrent]}
  aro: {tags: [us-gaap:AssetRetirementObligation]}
  aro_current: {tags: [us-gaap:AssetRetirementObligationCurrent]}
  aro_noncurrent: {tags: [us-gaap:AssetRetirementObligationsNoncurrent]}
  homebuilding_inventory: {tags: [us-gaap:InventoryOperativeBuilders, us-gaap:InventoryRealEstate]}
  homes_under_construction: {tags: [us-gaap:InventoryHomesUnderConstruction]}
  land_development: {tags: [us-gaap:InventoryRealEstateLandAndLandDevelopmentCosts]}
  land_held: {tags: [us-gaap:InventoryLandHeldForDevelopmentAndSale]}
  inventory_writedown: {tags: [us-gaap:InventoryWriteDown]}
  # Hospitals tag salaries and benefits; restaurants restaurant-level labor.
  labor_expense: {tags: [us-gaap:LaborAndRelatedExpense, us-gaap:CostDirectLabor]}
  casino_revenue:
    tags:
      - tag: us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
        dims: {srt:ProductOrServiceAxis: us-gaap:CasinoMember}
      - tag: us-gaap:Revenues
        dims: {srt:ProductOrServiceAxis: us-gaap:CasinoMember}
      - tag: us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax
        dims: {srt:ProductOrServiceAxis: us-gaap:CasinoMember}
  franchise_revenue:
    tags:
      - tag: us-gaap:Revenues
        dims: {us-gaap:FranchisorDisclosureAxis: us-gaap:FranchisedUnitsMember}
      - tag: us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
        dims: {us-gaap:FranchisorDisclosureAxis: us-gaap:FranchisedUnitsMember}
