# Metric catalog. Computed by rules only (no LLM).
#
# Which metrics a company gets is decided here and in industry_groups.yaml, curated once
# (domain knowledge, optionally LLM-assisted, then human-reviewed). It is never generated at
# run time. Each industry group lists the `metric_sets` it uses (plus extra metric codes), and
# company_overrides/ can add company-specific metrics. Helper metrics a listed metric depends
# on (e.g. ebit) are computed automatically.
#
# kind: text -> extracted from filing text by the LLM (Phase 5a, decisions D-032). `extraction`
#         gives the exact scope (`definition`), the words that locate it (`keywords`), and
#         whether two models must agree (`dual_check`, used for bank capital/liquidity metrics).
#       A formula metric with `extraction` is text-extracted only for periods XBRL does not
#         cover (e.g. an earnings release before the 10-Q); elsewhere the text value is only
#         cross-checked against XBRL (release_check). Decisions D-042.
# kind: external -> written by another stage (market data, Form 4), not computed (Phase 15).
# kind: formula (default) -> `formula` is one expression or an ordered list of alternatives.
#         The first alternative that evaluates wins. Names are concepts (concept_map.yaml)
#         or earlier metric codes. Supported operators: + - * / and parentheses.
#       growth -> (current - comparison) / |comparison| of `base`, compared with the prior
#         quarter (`prior_quarter`) or the same period a year earlier (`prior_year`).
# optional: names treated as 0 when missing, as long as one non-optional input is present.
# nm_when: condition that makes the value "not meaningful" (stored as N/M, no number).
# units: USD, ratio (x), fraction (0.05 = 5%).
# `x_py` in a formula is x for the same period a year earlier (averages such as ROA, D-043).
# display: false hides helper metrics from the front end (they are still stored for audit).
# insight_input: true puts a hidden metric into the insight input anyway (e.g. CEO pay).

# Hidden for now (2026-10-20, user decision, D-054): the Phase 15 metrics beyond the BRD. They
# are still computed and stored, but not published to the app, not given to the LLM (key
# insights, strategic risk, follow-ups, key takeaways, metric relevance), not used by threshold
# signals and not counted by the coverage report. Delete a set from this list to show it again.
hidden_metric_sets: [REPORTING_QUALITY, MARKET, CAPITAL_QUALITY]

metric_sets:
  COMMERCIAL_CORE:
    - revenue
    - revenue_growth_qoq
    - revenue_growth_yoy
    - net_income
    - operating_income
    - ebitda_computed
    - cash
    - current_assets
    - current_liabilities
    - current_ratio
    - working_capital
    - total_debt
    - long_term_debt
    - equity
    - debt_to_equity
    - interest_expense
    - interest_coverage
    - operating_cash_flow
    - capex
    - free_cash_flow
    - buybacks
    - buyback_intensity
  HOTEL_OPERATING:
    - revpar
    - occupancy
    - adr
  # Capital ratios come from XBRL where the bank tags them, otherwise from the text (D-042);
  # LCR, NIM and NPL are text-extracted. total_capital_ratio and total_loans are checks only.
  BANK_REGULATORY:
    - cet1_ratio
    - tier1_ratio
    - total_capital_ratio
    - lcr
    - nim
    - npl_ratio
    - total_loans
    - avg_interest_earning_assets
    - aum
    - var_total_avg
    - international_revenue
  # Pay versus performance from the proxy statement (D-042): input to insights, follow-up
  # questions and the pay/performance signal; not shown as metric rows.
  GOVERNANCE:
    - ceo_total_comp
    - ceo_comp_actually_paid
    - neo_avg_total_comp
    - tsr_value_100
    - peer_tsr_value_100
  BANK_CORE:
    - revenue
    - revenue_growth_qoq
    - revenue_growth_yoy
    - net_income
    - noninterest_income
    - fee_income_growth_yoy
    - equity
    - buybacks
    - buyback_intensity
    - roa
    - roe
    - loan_loss_reserve_ratio
    - fee_to_net_interest_income
  CONTRACT_REVENUE:
    - rpo
  MANUFACTURING_OPERATING:
    - capacity_utilization
  # Reporting quality and solvency (Phase 15c): non-financial groups.
  REPORTING_QUALITY:
    - receivables_days
    - inventory_days
    - accruals_ratio
    - debt_due_1y
    - debt_due_2y
    - debt_due_3y
    - debt_due_4y
    - debt_due_5y
    - debt_due_after_5y
    - near_term_debt_coverage
    - altman_z
  # Market data (Phase 15a), every group: written by the market stage from daily prices and
  # earnings estimates (Alpha Vantage), at each fiscal period end.
  MARKET:
    - market_cap
    - volatility_90d
    - max_drawdown_52w
    - eps_surprise_pct
    - insider_net_sales
    - officer_sell_pct
  # Every group (common_metric_sets in industry_groups.yaml).
  CAPITAL_QUALITY:
    - goodwill_to_equity
    - goodwill_impairment
    - sbc_to_revenue
    - diluted_shares_growth_yoy

  # -- Industry modules (Phase 16, D-052) -------------------------------------------------
  # Non-bank financials: returns and leverage instead of liquidity / EBITDA.
  FINANCIAL_CORE:
    - revenue
    - revenue_growth_yoy
    - net_income
    - equity
    - total_debt
    - debt_to_equity
    - roa
    - roe
    - assets_to_equity
    - buybacks
    - buyback_intensity
  PRODUCT_MARGINS:
    - gross_margin
    - rnd_to_revenue
  SOFTWARE_OPERATING:
    - gross_margin
    - rnd_to_revenue
    - deferred_revenue
    - deferred_revenue_growth_yoy
  PHARMA_OPERATING:
    - gross_margin
    - rnd_to_revenue
    - top_product_revenue
    - top_product_share
  MANAGED_CARE_OPERATING:
    - medical_cost_ratio
    - medical_members
  BANK_DEPOSITS:
    - deposits
    - deposit_growth_yoy
    - uninsured_deposits
    - uninsured_deposit_share
    - cre_loans
    - cre_loan_share
    - securities_unrealized_loss
    - unrealized_loss_to_equity
  ASSET_MANAGEMENT:
    - aum
    - net_flows
  PAYMENTS_OPERATING:
    - payments_volume
  INSURANCE_OPERATING:
    - net_investment_income
  RETAIL_OPERATING:
    - gross_margin
    - comparable_sales_growth
  STAPLES_OPERATING:
    - gross_margin
    - organic_sales_growth
  ENERGY_OPERATING:
    - production_boe_per_day
  UTILITY_OPERATING:
    - regulatory_assets
  TELECOM_OPERATING:
    - postpaid_phone_net_adds
    - postpaid_phone_churn
  AUTO_OPERATING:
    - vehicle_deliveries
    - warranty_reserve
    - pension_liability
  INDUSTRIAL_OPERATING:
    - warranty_reserve
    - pension_liability
  TRANSPORT_OPERATING:
    - operating_ratio
    - pension_liability
  # Industry modules (Phase 17, D-055): XBRL first, at most 3 text metrics per group.
  CHEMICALS_OPERATING: [environmental_reserve, capex_to_depreciation, volume_effect, price_effect]
  MINING_OPERATING: [asset_retirement_obligation, environmental_reserve, capex_to_depreciation,
                     gold_production, copper_production, aggregates_shipments]
  METALS_OPERATING: [environmental_reserve, capex_to_depreciation, metal_shipments,
                     average_selling_price_per_ton]
  HOMEBUILDING_OPERATING: [homebuilding_inventory, land_inventory, land_to_equity,
                           inventory_impairments, homes_closed, backlog_value, cancellation_rate]
  HEALTHCARE_OPERATING: [labor_to_revenue, same_facility_revenue_growth,
                         same_facility_volume_growth, admissions]
  GAMING_OPERATING: [casino_revenue_share, attendance]
  RESTAURANT_OPERATING: [comparable_sales_growth, labor_to_revenue, franchise_revenue_share,
                         restaurant_count, franchised_unit_share]
  # Trait clinical_stage (Phase 17c, D-058), set per company in companies.yaml.
  CLINICAL_STAGE: [cash_runway_months, rnd_to_opex]

metrics:
  # -- Financial -------------------------------------------------------------------------
  # Phase 16: a bank's net revenue where no total is tagged (BNY quarters). Concept names of
  # its own, so the bank metrics of the same name are not pulled into every company's list.
  - code: bank_net_revenue
    display_name: Net Revenue (net interest income + noninterest income)
    section: financial
    unit: USD
    formula: nii_parts + nonii_parts
    display: false
  - code: revenue
    display_name: Total Revenue
    section: financial
    unit: USD
    formula:
      - revenue
      - bank_net_revenue
  - code: revenue_growth_qoq
    display_name: Revenue Growth (QoQ)
    section: financial
    unit: fraction
    kind: growth
    base: revenue
    compare: prior_quarter
    period_types: [Q]
  - code: revenue_growth_yoy
    display_name: Revenue Growth (YoY)
    section: financial
    unit: fraction
    kind: growth
    base: revenue
    compare: prior_year
  - code: net_income
    display_name: Net Income
    section: financial
    unit: USD
    formula: net_income
  - code: operating_income
    display_name: Operating Income
    section: financial
    unit: USD
    formula: operating_income
  - code: ebitda_computed
    display_name: EBITDA (computed)
    description: >-
      Operating income + D&A; without an operating income line (pharma, oil majors), pre-tax
      income + interest expense + D&A. Not the company's non-GAAP Adjusted EBITDA.
    section: financial
    unit: USD
    formula:
      - operating_income + d_and_a
      - operating_income + depreciation + amortization_intangibles
      - pretax_income + interest_expense + d_and_a
      - pretax_income + interest_expense + depreciation + amortization_intangibles
    optional: [amortization_intangibles]
  - code: ebit
    display_name: EBIT
    description: Operating income; falls back to pre-tax income + interest expense.
    section: financial
    unit: USD
    display: false
    formula:
      - operating_income
      - pretax_income + interest_expense

  # -- Liquidity -------------------------------------------------------------------------
  - code: cash
    display_name: Cash & Equivalents
    section: liquidity
    unit: USD
    formula: cash
  - code: current_assets
    display_name: Current Assets
    section: liquidity
    unit: USD
    formula: current_assets
  - code: current_liabilities
    display_name: Current Liabilities
    section: liquidity
    unit: USD
    formula: current_liabilities
  - code: current_ratio
    display_name: Current Ratio
    section: liquidity
    unit: ratio
    formula: current_assets / current_liabilities
  - code: working_capital
    display_name: Working Capital
    section: liquidity
    unit: USD
    formula: current_assets - current_liabilities

  # -- Leverage --------------------------------------------------------------------------
  - code: total_debt
    display_name: Total Debt
    description: >-
      Reported total debt. Otherwise a same-family current + non-current pair (families are
      never mixed), plus short-term borrowings / commercial paper, plus finance lease
      liabilities for the LongTermDebt family, which excludes them (D-046).
    section: leverage
    unit: USD
    formula:
      - debt_total_reported
      - ltdcl_noncurrent + ltdcl_current + short_term_borrowings
      - ltd_noncurrent + ltd_current + short_term_borrowings + finance_lease_liabilities
      # Phase 16: all current debt (DebtCurrent) with the non-current long-term debt (PEP), or
      # long-term debt including current maturities plus short-term borrowings (TSLA).
      - ltd_noncurrent + debt_current + finance_lease_liabilities
      - ltd_total + short_term_borrowings + finance_lease_liabilities
      # Non-current only, used when the family has no current sibling. Understates debt;
      # dq_rules.yaml debt_completeness reports it.
      - ltdcl_noncurrent + short_term_borrowings
      - ltd_noncurrent + short_term_borrowings + finance_lease_liabilities
    optional: [short_term_borrowings, finance_lease_liabilities]
  - code: long_term_debt
    display_name: Long-term Debt
    section: leverage
    unit: USD
    formula:
      - ltdcl_noncurrent
      - ltd_noncurrent
  - code: equity
    display_name: Stockholders' Equity
    section: leverage
    unit: USD
    formula: equity
  - code: debt_to_equity
    display_name: Debt-to-Equity
    section: leverage
    unit: ratio
    formula: total_debt / equity
    nm_when: equity <= 0
  - code: interest_expense
    display_name: Interest Expense
    section: leverage
    unit: USD
    formula: interest_expense
  - code: interest_coverage
    display_name: Interest Coverage
    section: leverage
    unit: ratio
    formula: ebit / interest_expense
    nm_when: ebit <= 0

  # -- Cash flow -------------------------------------------------------------------------
  - code: operating_cash_flow
    display_name: Operating Cash Flow
    section: cash_flow
    unit: USD
    formula: operating_cash_flow
  - code: capex
    display_name: Capital Expenditures
    section: cash_flow
    unit: USD
    formula: capex
  - code: free_cash_flow
    display_name: Free Cash Flow
    section: cash_flow
    unit: USD
    formula: operating_cash_flow - capex
  - code: buybacks
    display_name: Share Repurchases
    section: cash_flow
    unit: USD
    formula: buybacks
  - code: buyback_intensity
    display_name: Buybacks / Net Income
    section: cash_flow
    unit: ratio
    formula: buybacks / net_income
    nm_when: net_income <= 0

  # -- Bank fee income (Performance Trends, Phase 8) --------------------------------------
  # Fee income = total noninterest income as reported (us-gaap:NoninterestIncome): banks' fees,
  # commissions, markets and other non-interest revenue. Decision D-036.
  - code: noninterest_income
    display_name: Noninterest (Fee) Income
    section: financial
    unit: USD
    formula: noninterest_income
  - code: fee_income_growth_yoy
    display_name: Fee Income Growth (YoY)
    section: fi_performance
    unit: fraction
    kind: growth
    base: noninterest_income
    compare: prior_year

  # -- Text-extracted operating metrics (kind: text) ---------------------------------------
  - code: revpar
    display_name: RevPAR
    section: operational
    unit: USD
    kind: text
    extraction:
      definition: >-
        Comparable systemwide worldwide RevPAR (revenue per available room) for the period, in
        US dollars. Use the worldwide (or total) comparable systemwide figure; not a region,
        brand, or owned/leased subset, and not a percentage change.
      keywords: [RevPAR]
      dual_check: true   # displayed: both models must read the same cell value (Phase 15h)
      table:   # read by cell, checked mechanically (D-044)
        column: [RevPAR]
        scope: [[systemwide, system-wide]]
        exclude_rows: &hotel_subsets [international, "u.s.", united states, us & canada,
          americas, europe, asia, china, middle east, africa, caribbean, latin america, luxury,
          premium, select, owned, leased, managed, franchised, all-inclusive, resorts]
  - code: occupancy
    display_name: Occupancy Rate
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Comparable systemwide worldwide occupancy rate for the period (a percentage level such
        as 69.3%, not a change in percentage points).
      keywords: [occupancy]
      dual_check: true   # displayed: both models must read the same cell value (Phase 15h)
      table:   # read by cell, checked mechanically (D-044)
        column: [Occupancy]
        scope: [[systemwide, system-wide]]
        exclude_rows: *hotel_subsets
  - code: adr
    display_name: Average Daily Rate
    section: operational
    unit: USD
    kind: text
    extraction:
      definition: >-
        Comparable systemwide worldwide average daily rate for the period, in US dollars (a
        level, not a percentage change).
      keywords: [average daily rate, ADR]
      dual_check: true   # displayed: both models must read the same cell value (Phase 15h)
      table:   # read by cell, checked mechanically (D-044)
        column: [Average Daily Rate, ADR]
        scope: [[systemwide, system-wide]]
        exclude_rows: *hotel_subsets

  # -- Text-extracted bank metrics (FI only) -----------------------------------------------
  - code: cet1_ratio
    display_name: CET1 Ratio
    section: fi_performance
    unit: fraction
    formula: cet1_ratio
    extraction:
      definition: >-
        Firm-wide Common Equity Tier 1 (CET1) capital ratio at period end under the
        Standardized approach. Not a bank subsidiary, not the Advanced approach, not a
        regulatory minimum or target.
      keywords: [CET1, Common equity Tier 1]
      dual_check: true
  - code: tier1_ratio
    display_name: Tier 1 Capital Ratio
    section: fi_performance
    unit: fraction
    formula: tier1_ratio
    extraction:
      definition: >-
        Firm-wide Tier 1 capital ratio at period end under the Standardized approach. Not a
        bank subsidiary, not the Advanced approach, not a minimum or target.
      keywords: [Tier 1 capital ratio, Tier 1 ratio]
      dual_check: true
  # -- Bank profitability and credit (XBRL, decisions D-043) --------------------------------------
  - code: roa
    display_name: Return on Average Assets (ROA)
    section: fi_performance
    unit: fraction
    formula: net_income / ((total_assets + total_assets_py) / 2)
    period_types: [FY]
  - code: roe
    display_name: Return on Average Equity (ROE)
    section: fi_performance
    unit: fraction
    formula: net_income / ((equity + equity_py) / 2)
    period_types: [FY]
    nm_when: equity <= 0
  - code: loan_loss_reserve_ratio
    display_name: Allowance for Loan Losses / Loans
    section: fi_performance
    unit: fraction
    formula: allowance_for_loan_losses / total_loans
  - code: net_interest_income
    display_name: Net Interest Income
    section: fi_performance
    unit: USD
    formula: net_interest_income
    display: false
  - code: fee_to_net_interest_income
    display_name: Noninterest Income / Net Interest Income
    section: fi_performance
    unit: ratio
    formula: noninterest_income / net_interest_income
    display: false
    insight_input: true
  - code: total_capital_ratio
    display_name: Total Capital Ratio
    section: fi_performance
    unit: fraction
    formula: total_capital_ratio
    display: false
    extraction:
      definition: >-
        Firm-wide total capital ratio (total risk-based capital ratio) at period end under the
        Standardized approach. Not a bank subsidiary, not the Advanced approach, not a minimum.
      keywords: [Total capital ratio]
      dual_check: true
  - code: total_loans
    display_name: Total Loans (retained)
    section: fi_performance
    unit: USD
    formula: total_loans
    display: false
  - code: lcr
    display_name: Liquidity Coverage Ratio
    section: fi_performance
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Firm-wide average liquidity coverage ratio (LCR) for the period (the firm, not a bank
        subsidiary), as a percentage.
      keywords: [LCR, liquidity coverage ratio]
      dual_check: true
  - code: nim
    display_name: Net Interest Margin
    section: fi_performance
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Firm-wide net interest margin / net yield on interest-earning assets for the period
        (e.g. "the net yield on these assets, on an FTE basis, was 2.40%"). Use the firm-wide
        figure; an FTE (fully taxable-equivalent) basis is fine when it is the only one given.
        Not a figure excluding a business (e.g. "excluding Markets"), not a change in bps.
      keywords: [net interest margin, net interest yield, net yield on]
      dual_check: true
  - code: npl_ratio
    display_name: Nonperforming Loan Ratio
    section: fi_performance
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Firm-wide nonaccrual (nonperforming) loans as a percentage of total loans at period end,
        only when the filing states this ratio directly.
      keywords: [nonaccrual loans to total loans, nonperforming loans to total loans, nonaccrual]
      dual_check: true

  # -- Pay versus performance (DEF 14A; not displayed, insight input, decisions D-042) ------------
  - code: ceo_total_comp
    display_name: CEO Total Compensation (Summary Compensation Table)
    section: governance
    unit: USD
    formula: ceo_total_comp
    period_types: [FY]
    display: false
    insight_input: true
  - code: ceo_comp_actually_paid
    display_name: CEO Compensation Actually Paid
    section: governance
    unit: USD
    formula: ceo_comp_actually_paid
    period_types: [FY]
    display: false
    insight_input: true
  - code: neo_avg_total_comp
    display_name: Other Named Executives' Average Total Compensation
    section: governance
    unit: USD
    formula: neo_avg_total_comp
    period_types: [FY]
    display: false
    insight_input: true
  - code: tsr_value_100
    display_name: Company TSR (value of $100 invested)
    section: governance
    unit: USD
    formula: tsr_value_100
    period_types: [FY]
    display: false
    insight_input: true
  - code: peer_tsr_value_100
    display_name: Peer Group TSR (value of $100 invested)
    section: governance
    unit: USD
    formula: peer_tsr_value_100
    period_types: [FY]
    display: false
    insight_input: true
  - code: rpo
    display_name: Remaining Performance Obligations (contracted revenue)
    section: financial
    unit: USD
    formula: rpo
    display: false
    insight_input: true

  # -- Read from tables by cell (D-044); not displayed, insight input ---------------------------
  - code: avg_interest_earning_assets
    display_name: Average Interest-Earning Assets
    section: fi_performance
    unit: USD
    kind: text
    display: false   # checks NIM (dq_rules.yaml nim_relation)
    extraction:
      definition: >-
        Firm-wide average interest-earning assets for the period, in US dollars (not excluding
        Markets or any business).
      keywords: [average interest-earning assets]
      table:
        column: [average interest-earning assets]
        exclude_rows: [markets, excluding]
  - code: aum
    display_name: Assets Under Management
    section: fi_performance
    unit: USD
    kind: text
    display: false
    insight_input: true
    extraction:
      definition: >-
        Total assets under management of the firm at period end, in US dollars (the total,
        not client assets, a region or an asset class).
      keywords: [assets under management]
      table:
        column: [total assets under management]
  - code: var_total_avg
    display_name: Average Total VaR (95%)
    section: fi_performance
    unit: USD
    kind: text
    display: false
    insight_input: true
    extraction:
      definition: >-
        Firm-wide total value-at-risk, average for the quarter, in US dollars (the total, not a
        business or risk type; the average, not the minimum or maximum).
      keywords: [Total VaR]
      table:
        column: [total var]
        exclude: [min, max, "vs.", change]
  - code: international_revenue
    display_name: International Revenue (outside North America)
    section: financial
    unit: USD
    kind: text
    display: false
    insight_input: true
    extraction:
      definition: >-
        The firm's total revenue from international operations (outside North America) for the
        fiscal year: the row named "Total international" in the notes' table of international
        operations (revenue, expense, income before tax, net income and total assets by
        region). Not a business segment's "Total international net revenue" table.
      keywords: [total international]
      table:
        column: [revenue]
        find: [total international]
        scope: [[total international]]
        # Business-segment tables ("International metrics" of CIB / AWM) label their row
        # "Total international net revenue"; the firm-wide note says "Total international".
        exclude_rows: [net revenue]
  - code: capacity_utilization
    display_name: Capacity Utilization
    section: operational
    unit: fraction
    kind: text
    display: false
    insight_input: true
    extraction:
      definition: >-
        Company-wide manufacturing capacity utilization for the period, as a percentage (a
        level, not a change). For a steel or metals producer: the steel mills' utilization or
        operating rate (Phase 17), not one mill or the downstream products segment.
      keywords: [capacity utilization, mill utilization, utilization rate, operating rates]
      table:
        column: [capacity utilization, capacity utilisation, utilization, operating rate]

  # -- Market data (Phase 15a) ------------------------------------------------------------------
  # kind: external -> written by another stage, here the market stage (prices at the period
  # end, Alpha Vantage); formulas may use them (Altman Z). Fractions: 0.30 = 30%.
  - code: market_cap
    display_name: Market Capitalization
    description: Closing price on the last trading day of the period times shares outstanding
      (cover page of the period's filing, else diluted weighted-average shares).
    section: market
    unit: USD
    kind: external
  - code: volatility_90d
    display_name: Share Price Volatility (90 days)
    description: Annualized standard deviation of daily returns over the 63 trading days to the
      period end (split- and dividend-adjusted).
    section: market
    unit: fraction
    kind: external
  - code: max_drawdown_52w
    display_name: Max Drawdown (52 weeks)
    description: Largest fall from a high in the year to the period end (negative).
    section: market
    unit: fraction
    kind: external
  - code: eps_surprise_pct
    display_name: EPS Surprise
    description: Reported EPS against the consensus estimate, as a share of the estimate
      (negative = a miss).
    section: market
    unit: fraction
    kind: external
    period_types: [Q]

  # Insider trading (Phase 15b): written by the documents stage from Form 4 filings.
  - code: insider_net_sales
    display_name: Insider Net Open-Market Sales
    description: Officers' and directors' open-market sales minus purchases in the quarter
      (Form 4); option exercises, tax withholding, awards and gifts are left out.
    section: market
    unit: USD
    kind: external
    period_types: [Q]
  - code: officer_sell_pct
    display_name: Holdings Sold by Officers
    description: Shares officers sold on the open market in the quarter as a share of their
      holdings before those sales (Form 4).
    section: market
    unit: fraction
    kind: external
    period_types: [Q]

  # -- Reporting quality and solvency (Phase 15c) ----------------------------------------------
  # Days on the fiscal year (365); quarterly flows against a year-end balance would need their
  # own day count, so these are annual only.
  - code: receivables_days
    display_name: Days Sales Outstanding
    description: Trade receivables at year-end in days of annual revenue.
    section: reporting_quality
    unit: days
    period_types: [FY]
    formula: receivables / revenue * 365
    nm_when: revenue <= 0
  - code: inventory_days
    display_name: Days Inventory Outstanding
    description: Inventory at year-end in days of annual cost of goods sold.
    section: reporting_quality
    unit: days
    period_types: [FY]
    formula: inventory / cost_of_revenue * 365
    nm_when: cost_of_revenue <= 0
  - code: accruals_ratio
    display_name: Accruals / Total Assets
    description: Net income not backed by operating cash flow, as a share of total assets; high
      values can signal aggressive accounting.
    section: reporting_quality
    unit: fraction
    formula: (net_income - operating_cash_flow) / total_assets
  - code: goodwill_to_equity
    display_name: Goodwill / Equity
    section: reporting_quality
    unit: ratio
    period_types: [FY]  # tagged in 10-Ks; few 10-Qs carry it
    formula: goodwill / equity
    nm_when: equity <= 0
  - code: goodwill_impairment
    display_name: Goodwill Impairment
    section: reporting_quality
    unit: USD
    period_types: [FY]  # tagged in 10-Ks; few 10-Qs carry it
    formula: goodwill_impairment
  - code: sbc_to_revenue
    display_name: Stock Compensation / Revenue
    section: reporting_quality
    unit: fraction
    period_types: [FY]  # tagged in 10-Ks; few 10-Qs carry it
    formula: sbc / revenue
    nm_when: revenue <= 0
  - code: diluted_shares
    display_name: Diluted Shares (weighted average)
    section: reporting_quality
    unit: shares
    period_types: [FY]  # weighted-average shares: 10-Ks give the year, not Q4
    formula: diluted_shares
    display: false
  - code: diluted_shares_growth_yoy
    display_name: Diluted Share Count Growth (YoY)
    description: Dilution from share issuance; negative when buybacks shrink the share count.
    section: reporting_quality
    unit: fraction
    period_types: [FY]  # weighted-average shares: 10-Ks give the year, not Q4
    kind: growth
    base: diluted_shares
    compare: prior_year
  - code: debt_due_1y
    display_name: Debt Due Within 1 Year
    description: Scheduled long-term debt repayments in the next twelve months (10-K note).
    section: leverage
    unit: USD
    period_types: [FY]
    formula: debt_due_1y
  - code: debt_due_2y
    display_name: Debt Due in Year 2
    section: leverage
    unit: USD
    period_types: [FY]
    formula: debt_due_2y
    display: false  # only companies that tag the maturity schedule have years 2-5
    insight_input: true
  - code: debt_due_3y
    display_name: Debt Due in Year 3
    section: leverage
    unit: USD
    period_types: [FY]
    formula: debt_due_3y
    display: false
    insight_input: true
  - code: debt_due_4y
    display_name: Debt Due in Year 4
    section: leverage
    unit: USD
    period_types: [FY]
    formula: debt_due_4y
    display: false
    insight_input: true
  - code: debt_due_5y
    display_name: Debt Due in Year 5
    section: leverage
    unit: USD
    period_types: [FY]
    formula: debt_due_5y
    display: false
    insight_input: true
  - code: debt_due_after_5y
    display_name: Debt Due After Year 5
    section: leverage
    unit: USD
    period_types: [FY]
    formula: debt_due_after_5y
    display: false
    insight_input: true
  - code: near_term_debt_coverage
    display_name: Debt Due in 1 Year / (Cash + Operating Cash Flow)
    description: Above 1.0, the debt due within a year exceeds cash and short-term investments
      plus a year of operating cash flow (refinancing risk).
    section: leverage
    unit: ratio
    period_types: [FY]
    formula: debt_due_1y / (cash + short_term_investments + operating_cash_flow)
    optional: [short_term_investments]
    nm_when: cash + short_term_investments + operating_cash_flow <= 0
  # Altman Z-score (original public-manufacturer form): below 1.81 distress, above 2.99 safe.
  # Uses the market stage's market cap; not meaningful for banks (not in their sets).
  - code: altman_z
    display_name: Altman Z-Score
    description: 1.2 working capital/assets + 1.4 retained earnings/assets + 3.3 EBIT/assets +
      0.6 market cap/liabilities + 1.0 revenue/assets. Below 1.81 signals distress.
    section: reporting_quality
    unit: score
    period_types: [FY]
    formula:  # without a total liabilities tag: assets - equity
      - >-
        1.2 * working_capital / total_assets + 1.4 * retained_earnings / total_assets
        + 3.3 * ebit / total_assets + 0.6 * market_cap / total_liabilities
        + revenue / total_assets
      - >-
        1.2 * working_capital / total_assets + 1.4 * retained_earnings / total_assets
        + 3.3 * ebit / total_assets + 0.6 * market_cap / (total_assets - equity)
        + revenue / total_assets

  # -- Industry modules (Phase 16, D-052): XBRL first; text metrics are read from the MD&A and
  # earnings releases and need two reads to agree (dual_check). ----------------------------
  - code: gross_margin
    display_name: Gross Margin
    section: financial
    unit: fraction
    formula:
      - gross_profit / revenue
      - (revenue - cost_of_revenue) / revenue
    nm_when: revenue <= 0
  - code: rnd_to_revenue
    display_name: R&D / Revenue
    section: operational
    unit: fraction
    formula: research_development / revenue
    nm_when: revenue <= 0
  - code: deferred_revenue
    display_name: Deferred Revenue (Contract Liabilities)
    section: financial
    unit: USD
    formula: deferred_revenue
  - code: deferred_revenue_growth_yoy
    display_name: Deferred Revenue Growth (YoY)
    section: financial
    unit: fraction
    kind: growth
    base: deferred_revenue
    compare: prior_year
  - code: operating_ratio
    display_name: Operating Ratio
    description: Operating expenses / revenue (1 - operating margin); lower is better.
    section: operational
    unit: fraction
    formula: (revenue - operating_income) / revenue
    nm_when: revenue <= 0
  - code: warranty_reserve
    display_name: Product Warranty Reserve
    section: operational
    unit: USD
    formula:
      - warranty_total
      - warranty_current + warranty_noncurrent
    optional: [warranty_noncurrent]
  - code: pension_liability
    display_name: Pension & Retiree Benefit Liabilities
    description: Non-current liabilities for pensions and other retiree benefits (underfunding).
    section: leverage
    unit: USD
    period_types: [FY]
    formula: pension_liability
  - code: regulatory_assets
    display_name: Regulatory Assets (non-current)
    section: financial
    unit: USD
    formula: regulatory_assets
  - code: assets_to_equity
    display_name: Total Assets / Equity
    section: leverage
    unit: ratio
    formula: total_assets / equity
    nm_when: equity <= 0
  - code: net_investment_income
    display_name: Net Investment Income
    section: fi_performance
    unit: USD
    formula: net_investment_income
  - code: deposits
    display_name: Total Deposits
    section: fi_performance
    unit: USD
    formula: deposits
  - code: deposit_growth_yoy
    display_name: Deposit Growth (YoY)
    section: fi_performance
    unit: fraction
    kind: growth
    base: deposits
    compare: prior_year
  - code: securities_unrealized_loss
    display_name: Unrealized Losses on AFS and HTM Securities
    section: fi_performance
    unit: USD
    formula:
      - afs_unrealized_loss + htm_unrecognized_loss
      - afs_unrealized_loss
      - htm_unrecognized_loss
    display: false
    insight_input: true
  - code: unrealized_loss_to_equity
    display_name: Unrealized Securities Losses / Equity
    section: fi_performance
    unit: fraction
    formula: securities_unrealized_loss / equity
    nm_when: equity <= 0
  - code: uninsured_deposits
    display_name: Estimated Uninsured Deposits
    section: fi_performance
    unit: USD
    kind: text
    display: false
    insight_input: true
    extraction:
      definition: >-
        Estimated uninsured deposits of the bank or banks at period end, in US dollars (deposits
        above the FDIC insurance limit, as the filing estimates them). The firm total, not a
        share, not deposits of one subsidiary when a total is given, not insured deposits.
      keywords: [uninsured deposits, estimated uninsured]
      dual_check: true
  - code: uninsured_deposit_share
    display_name: Uninsured Deposits / Total Deposits
    section: fi_performance
    unit: fraction
    formula: uninsured_deposits / deposits
  - code: cre_loans
    display_name: Commercial Real Estate Loans
    section: loan_portfolio
    unit: USD
    kind: text
    display: false
    insight_input: true
    extraction:
      definition: >-
        Total commercial real estate loans at period end, in US dollars, as the filing totals
        them (all CRE loan types: office, multifamily, retail, industrial, construction). Not
        commitments or exposure including unfunded amounts, not one property type, not
        residential mortgages.
      keywords: [commercial real estate]
      dual_check: true
  - code: cre_loan_share
    display_name: CRE Loans / Total Loans
    section: loan_portfolio
    unit: fraction
    formula: cre_loans / total_loans
  - code: net_flows
    display_name: Net Client Flows
    description: Long-term net inflows (asset managers) or net new client assets (wealth and brokerage).
    section: fi_performance
    unit: USD
    kind: text
    extraction:
      definition: >-
        Firm-wide net flows for the period, in US dollars: long-term net inflows for an asset
        manager, or net new assets (net new client assets) for a wealth or brokerage firm.
        Outflows are negative. Not total net flows including cash or money market when a
        long-term figure is given, not a single product or region, not market appreciation.
      keywords: [net inflows, net new assets, net flows, net new client assets]
      dual_check: true
  - code: payments_volume
    display_name: Payments Volume
    description: Payments volume (Visa) or gross dollar volume (Mastercard) over the network.
    section: operational
    unit: USD
    kind: text
    extraction:
      definition: >-
        Total payments volume processed over the company's network for the period, in US
        dollars: "payments volume" (Visa) or "gross dollar volume (GDV)" (Mastercard). The
        worldwide total, not a region, not processed transactions (a count), not growth.
      keywords: [payments volume, gross dollar volume, GDV]
      dual_check: true
  - code: medical_cost_ratio
    display_name: Medical Cost Ratio
    description: Medical costs / premiums ("medical care ratio", "medical benefit ratio").
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        The company-wide medical care ratio / medical benefit ratio / medical loss ratio for
        the period (medical costs as a percentage of premiums). The consolidated or health
        benefits segment ratio as reported; not a target, not a change in points.
      keywords: [medical care ratio, medical benefit ratio, medical cost ratio, medical loss ratio, MBR]
      dual_check: true
  - code: medical_members
    display_name: Medical Members
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Total medical members (people with medical benefits through the company's health plans)
        at period end, a count of people. The total across commercial, Medicare and Medicaid,
        not one line of business, not pharmacy-benefit members, not people served by all
        businesses.
      keywords: [medical members, medical membership, people served, members]
      dual_check: true
  - code: comparable_sales_growth
    display_name: Comparable Sales Growth
    description: Change in sales at stores (and digital channels) open more than a year.
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Total company comparable sales growth for the period ("comparable sales increased
        4.2%"), a growth rate: give a decrease as a negative number. The total company or
        total comparable figure; not a single country, segment or channel when a total is
        given, not excluding fuel or currency when the reported total is also given.
      keywords: [comparable sales, comp sales, comparable store sales, same-store sales]
      dual_check: true
  - code: organic_sales_growth
    display_name: Organic Sales Growth
    description: Revenue growth excluding currency, acquisitions and divestitures.
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Total company organic revenue (net sales) growth for the period, a growth rate: give a
        decline as a negative number. The total company figure, not a segment or region, not
        volume or price alone.
      keywords: [organic revenue, organic net revenue, organic sales, organic growth]
      dual_check: true
  - code: production_boe_per_day
    display_name: Oil-Equivalent Production (boe per day)
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Total net oil-equivalent production for the period in barrels of oil equivalent per
        day (worldwide, all products). Not liquids or gas alone, not one region, not a
        forecast. "4.6 million oil-equivalent barrels per day" is 4.6 in millions; "1,987
        MBOED" is 1,987 in thousands.
      keywords: [oil-equivalent, barrels of oil equivalent per day, boe per day, MBOED, MBoe/d, net production]
      dual_check: true
  - code: postpaid_phone_net_adds
    display_name: Postpaid Phone Net Additions
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Postpaid phone net additions (net adds) for the period, a count of subscribers;
        negative for net losses. Total postpaid phone, not postpaid total including other
        devices, not prepaid, not broadband.
      keywords: [postpaid phone net additions, postpaid phone net adds, phone net adds]
      dual_check: true
  - code: postpaid_phone_churn
    display_name: Postpaid Phone Churn
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Postpaid phone churn for the period (monthly average), as a percentage. Postpaid phone
        only; not total postpaid, not prepaid, not a change.
      keywords: [postpaid phone churn, phone churn]
      dual_check: true
  - code: vehicle_deliveries
    display_name: Vehicle Deliveries / Wholesales
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Total vehicles delivered to customers or dealers (deliveries, or wholesale vehicle
        sales / wholesales) for the period, worldwide, a count of vehicles. Not production,
        not one region or model when a total is given, not retail registrations.
      keywords: [deliveries, delivered, wholesale vehicle sales, wholesales, vehicle sales]
      dual_check: true
  - code: top_product_revenue
    display_name: Largest Product Revenue
    section: operational
    unit: USD
    kind: text
    display: false
    insight_input: true
    extraction:
      definition: >-
        Revenue of the company's single largest product (by revenue) for the period, in US
        dollars, as the product revenue table or text gives it (e.g. Keytruda, Humira). One
        product's worldwide total; not a franchise or therapeutic area, not a region.
      keywords: [product revenue, worldwide sales, net product sales, revenues by product]
      dual_check: true
  - code: top_product_share
    display_name: Largest Product / Revenue
    section: operational
    unit: fraction
    formula: top_product_revenue / revenue
    nm_when: revenue <= 0

  # -- Industry modules (Phase 17, D-055) --------------------------------------------------
  # Chemicals, mining and metals.
  - code: environmental_reserve
    display_name: Environmental Remediation Reserve
    description: Accrued liabilities for environmental remediation (current and non-current).
    section: operational
    unit: USD
    formula:
      - env_accrual
      - env_accrual_current + env_accrual_noncurrent
    optional: [env_accrual_current]
  - code: asset_retirement_obligation
    display_name: Asset Retirement Obligations
    description: Liabilities for closing and reclaiming mines and plants (current and non-current).
    section: operational
    unit: USD
    formula:
      - aro
      - aro_current + aro_noncurrent
    optional: [aro_current]
  - code: capex_to_depreciation
    display_name: Capex to Depreciation
    description: >-
      Capital expenditures / depreciation and amortization; below 1 the company is not replacing
      the assets it uses up.
    section: operational
    unit: ratio
    formula:
      - capex / d_and_a
      - capex / depreciation
  - code: volume_effect
    display_name: Sales Change from Volume
    description: The part of the change in net sales from a year earlier that came from volume.
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        The contribution of sales volume to the change in total company net sales versus the
        same period a year earlier, as a percentage of net sales ("volume 3%", "lower volumes
        reduced sales 2%"): give a decrease as a negative number. The company total, not a
        segment; not price, currency, or acquisition and divestiture effects.
      keywords: [volume, local price, price/mix, sales volume, change in net sales]
      dual_check: true
  - code: price_effect
    display_name: Sales Change from Price
    description: The part of the change in net sales from a year earlier that came from prices.
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        The contribution of selling prices (local price, price/mix) to the change in total
        company net sales versus the same period a year earlier, as a percentage of net sales
        ("local price -4%"): give a decrease as a negative number. The company total, not a
        segment; not volume, currency, or acquisition and divestiture effects.
      keywords: [local price, price/mix, selling prices, pricing, change in net sales]
      dual_check: true
  - code: gold_production
    display_name: Gold Production (ounces)
    section: operational
    unit: ounces
    kind: text
    extraction:
      definition: >-
        Attributable gold produced in the period, in ounces (unit: count), company total over
        all sites. Not gold-equivalent ounces that include other metals, not ounces sold when
        production is given, not guidance. "1.5 million attributable ounces" is 1.5 in
        millions; "1,520 koz" is 1,520 in thousands.
      keywords: [attributable gold production, gold production, ounces produced, attributable ounces, koz]
      dual_check: true
  - code: copper_production
    display_name: Copper Production (pounds)
    section: operational
    unit: pounds
    kind: text
    extraction:
      definition: >-
        Copper produced in the period, in pounds (unit: count), consolidated company total;
        copper sold only when production is not given. Not guidance, not a single mine when a
        total is given; a figure in metric tons is not this metric. "1.0 billion pounds" is
        1.0 in billions.
      keywords: [copper production, pounds of copper, copper sales, million pounds, consolidated copper]
      dual_check: true
  - code: aggregates_shipments
    display_name: Aggregates Shipments (tons)
    section: operational
    unit: tons
    kind: text
    extraction:
      definition: >-
        Aggregates (crushed stone, sand and gravel) shipped in the period, in tons (unit:
        count), company total. Not revenue or price per ton, not cement or asphalt. "220 million
        tons" is 220 in millions.
      keywords: [aggregates shipments, aggregates volume, shipments, tons]
      dual_check: true
  - code: metal_shipments
    display_name: Steel and Metal Shipments (tons)
    section: operational
    unit: tons
    kind: text
    extraction:
      definition: >-
        Total tons of steel or aluminum products shipped to outside customers in the period, in
        net tons or metric tons as the company reports them (unit: count), company total. Not
        production or capacity, not one segment or mill when a total is given. "6.2 million
        tons" is 6.2 in millions; "5,800 thousand net tons" is 5,800 in thousands.
      keywords: [shipments, tons shipped, net tons, metric tons, total shipments]
      dual_check: true
  - code: average_selling_price_per_ton
    display_name: Average Selling Price per Ton
    section: operational
    unit: USD
    kind: text
    extraction:
      definition: >-
        Average selling (realized) price per ton of the company's main metal products in the
        period, in US dollars: total steel mills or all steel products for a steelmaker, the
        realized primary aluminum price for an aluminum producer. A price level, not a change;
        not one product line when a total is given.
      keywords: [average selling price per ton, average sales price per ton, average net selling price, realized price, per ton, per metric ton]
      dual_check: true
  # Homebuilders.
  - code: homebuilding_inventory
    display_name: Homebuilding Inventory
    description: Homes under construction, finished homes, land and lots.
    section: operational
    unit: USD
    formula: homebuilding_inventory
  - code: land_inventory
    display_name: Land and Lots
    description: >-
      Homebuilding inventory other than homes under construction (land, lots, model homes),
      the main exposure to land write-downs. Some builders tag only raw land as land (PulteGroup:
      $0.57B of $13.7B), so the difference comes first.
    section: operational
    unit: USD
    formula:
      - homebuilding_inventory - homes_under_construction
      - land_development + land_held
    optional: [land_held]
  - code: land_to_equity
    display_name: Land to Equity
    section: operational
    unit: ratio
    formula: land_inventory / equity
    nm_when: equity <= 0
  - code: inventory_impairments
    display_name: Inventory and Land Impairments
    description: Write-downs of homes, land and lots in the period.
    section: operational
    unit: USD
    formula: inventory_writedown
  - code: homes_closed
    display_name: Homes Closed
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Number of homes closed (delivered to buyers, "settlements") in the period, company total
        over all segments and brands, a count of homes. Not net new orders, not backlog, not one
        region when a total is given.
      keywords: [homes closed, closings, homes delivered, deliveries, settlements]
      dual_check: true
  - code: backlog_value
    display_name: Backlog Value
    description: Sales value of homes under contract but not yet closed at the end of the period.
    section: operational
    unit: USD
    kind: text
    extraction:
      definition: >-
        Dollar value of the homebuilding sales backlog (homes under contract, not yet closed)
        at the end of the period, company total. Not the number of homes, not net new orders.
      keywords: [backlog, sales backlog, homes in backlog, value of backlog]
      dual_check: true
  - code: cancellation_rate
    display_name: Cancellation Rate
    description: Share of gross new home orders cancelled by buyers in the period.
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Cancellation rate for the period: cancellations as a percentage of gross new orders,
        company total. A level ("13%"), not a change.
      keywords: [cancellation rate, cancellations as a percentage, cancellation]
      dual_check: true
  # Healthcare services and restaurants.
  - code: labor_to_revenue
    display_name: Labor Cost / Revenue
    description: Salaries, wages and benefits / revenue (staffing cost pressure).
    section: operational
    unit: fraction
    formula: labor_expense / revenue
    nm_when: revenue <= 0
  - code: same_facility_revenue_growth
    display_name: Same-Facility Revenue Growth
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Growth in net revenue (net patient service revenues) on a same-facility or
        same-hospital basis versus the same period a year earlier, company total, a growth rate:
        give a decrease as a negative number. Not revenue per admission or per adjusted
        admission, not total growth including acquired facilities.
      keywords: [same facility, same-facility, same hospital, same-hospital, same store, net patient service revenues]
      dual_check: true
  - code: same_facility_volume_growth
    display_name: Same-Facility Volume Growth
    description: >-
      Growth in patient volume on a same-facility or organic basis: equivalent admissions for
      hospitals, treatments for dialysis, requisitions for laboratories.
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Growth in patient volume versus the same period a year earlier on a same-facility,
        same-hospital or organic basis, company total, a growth rate (give a decrease as a
        negative number): equivalent (adjusted) admissions for hospitals, admissions when
        neither is given; treatments for dialysis; requisitions or organic volume for
        laboratories. Not revenue growth, not per-day or per-admission figures.
      keywords: [equivalent admissions, adjusted admissions, admissions, treatments, requisitions, organic volume, same facility, same-hospital]
      dual_check: true
  - code: admissions
    display_name: Hospital Admissions
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Number of inpatient admissions in the period at all consolidated hospitals, a count of
        admissions. Not equivalent admissions, not same-facility only when a consolidated
        figure is given, not admissions per day or per bed.
      keywords: [admissions, inpatient admissions]
      dual_check: true
  # Gaming and leisure.
  - code: casino_revenue_share
    display_name: Casino Revenue / Revenue
    description: Gaming revenue / total revenue; the rest is rooms, food and beverage and other.
    section: operational
    unit: fraction
    formula: casino_revenue / revenue
    nm_when: revenue <= 0
  - code: attendance
    display_name: Attendance
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Total attendance at the company's events, venues or parks in the period (fans,
        visitors, guests), company total, a count of people. Not tickets sold through a
        ticketing platform for others, not one venue or region when a total is given.
      keywords: [attendance, fans, visitors, guests, attended]
      dual_check: true
  - code: franchise_revenue_share
    display_name: Franchise Revenue / Revenue
    description: Revenue from franchised or licensed restaurants / total revenue.
    section: operational
    unit: fraction
    formula: franchise_revenue / revenue
    nm_when: revenue <= 0
  - code: restaurant_count
    display_name: Restaurants (system-wide)
    section: operational
    unit: count
    kind: text
    extraction:
      definition: >-
        Total number of restaurants (stores) open at the end of the period, system-wide
        (company-operated plus franchised or licensed) and worldwide, a count. Not net openings
        in the period, not one brand or country when a total is given.
      keywords: [restaurants, system-wide, systemwide, stores, total restaurants, restaurant count]
      dual_check: true
  - code: franchised_unit_share
    display_name: Franchised Share of Restaurants
    section: operational
    unit: fraction
    kind: text
    extraction:
      definition: >-
        Share of the system's restaurants (stores) operated by franchisees or licensees at the
        end of the period, as a percentage ("approximately 95% franchised"). Not the share of
        revenue or sales.
      keywords: [franchised, licensed stores, franchisees, percent franchised]
      dual_check: true
  # Clinical-stage companies (Phase 17c, D-058).
  - code: monthly_cash_burn
    display_name: Monthly Cash Burn
    description: >-
      Operating cash outflow per month over the last four quarters; the latest quarter's when
      the four are not all available or one is N/M (Xenon's Q4 2025). Negative: cash generated.
    section: liquidity
    unit: USD
    display: false
    formula:
      - -operating_cash_flow_ttm / 12
      - -operating_cash_flow / 3
  - code: cash_runway_months
    display_name: Cash Runway (months)
    description: >-
      Cash and short-term investments / the monthly operating cash outflow of the last four
      quarters (or the latest quarter). N/M when there is no cash burn.
    section: liquidity
    unit: months
    formula: (cash + short_term_investments) / monthly_cash_burn
    optional: [short_term_investments]
    nm_when: monthly_cash_burn <= 0
  - code: rnd_to_opex
    display_name: R&D / Operating Expenses
    description: Research and development / total operating expenses.
    section: operational
    unit: fraction
    formula: research_development / operating_expenses
    nm_when: operating_expenses <= 0
