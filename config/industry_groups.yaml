# SIC code -> industry group -> metric list. All companies with the same SIC share the same
# metrics. The lists are curated here (see metrics.yaml header), not generated at run time.
# Lookup order: a company's `industry` in companies.yaml, then exact `sic`, then `sic_ranges`
# (first match), then `default_group`.
# `is_financial` controls whether FI-only modules (NIM, CET1, NPL, loan portfolio) get data.
# `metric_sets` refer to metrics.yaml; `metrics` adds individual metric codes.
# What a group does not track (D-049; guide: docs/CONFIGURATION.md):
#   exclude_metrics: [codes]      metrics from its sets it drops (a metric another tracked
#                                 metric needs is still computed, hidden)
#   exclude_signals: [rule ids]   signals from signal_rules.yaml it drops; `8k_5.02` also drops
#                                 8k_5.02_cfo_departure etc. (`uw-pipeline config show` lists ids)
#   signal_params: {rule id: {field: value}}   rule fields for this group only, e.g.
#                                 {pay_vs_performance: {min_pay_growth: 0.5}}

default_group: UNCLASSIFIED

# Traits (decisions D-043): business-model properties that decide metric sets. A group's sets
# are its `metric_sets`, plus `common_metric_sets`, plus the sets of each of its `traits`.
common_metric_sets: [GOVERNANCE, CAPITAL_QUALITY, MARKET]
trait_metric_sets:
  bank: [BANK_CORE, BANK_REGULATORY, BANK_DEPOSITS]
  lodging: [HOTEL_OPERATING]
  contract_revenue: [CONTRACT_REVENUE]   # remaining performance obligations (RPO)
  manufacturing: [MANUFACTURING_OPERATING]
  captive_finance: []                    # debt includes a finance arm (Ford Credit): see coverage
  # Per company in companies.yaml (D-058): revenue under USD 10M in life sciences.
  clinical_stage: [CLINICAL_STAGE]

# MD&A history for text metrics (D-069): a company that shows a `kind: text` metric (RevPAR,
# CET1, postpaid churn, ...) keeps the MD&A of its 10-Ks of the last `years` years and of its
# 10-Qs of the last `quarters` quarters, beyond the normal text window, so the cards and the
# 5-year view have history (otherwise only the filings of about the last 13 months are read).
# A group's own `mdna_history_years` / `mdna_history_quarters` override this.
text_metric_history: {years: 5, quarters: 8}

# Metrics a trait makes meaningless, dropped for companies with it (D-058).
trait_exclude_metrics:
  clinical_stage: [gross_margin, rnd_to_revenue, top_product_revenue, top_product_share]

groups:
  UNCLASSIFIED:
    label: Unclassified
    is_financial: false
    metric_sets: []
  HOTELS:
    label: Hotels & Lodging
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY]
    traits: [lodging]
  AIRLINES:
    label: Airlines
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY]
  AUTOMOTIVE:
    label: Automotive Manufacturing
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY, AUTO_OPERATING]
    traits: [manufacturing, captive_finance]
  PHARMA:
    label: Pharmaceuticals & Biotech
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY, PHARMA_OPERATING]
  BANKS:
    label: Banks
    is_financial: true
    metric_sets: []
    traits: [bank]
    mdna_history_years: 5   # Performance Trends: 5 years of NIM / CET1 / NPL (Phase 8)
  # Non-bank financials (Phase 16): returns and leverage, plus their own module.
  CREDIT:
    label: Non-depository Credit
    is_financial: true
    metric_sets: [FINANCIAL_CORE]
  BROKER_DEALERS:
    label: Securities, Brokerage & Asset Management
    is_financial: true
    metric_sets: [FINANCIAL_CORE, ASSET_MANAGEMENT]
    metrics: [var_total_avg]
  # Bank-style FI modules (CET1, NIM, loan book) don't fit insurers. See decisions D-008.
  INSURANCE:
    label: Insurance
    is_financial: false
    metric_sets: [FINANCIAL_CORE, INSURANCE_OPERATING]
  RETAIL:
    label: Retail
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY, RETAIL_OPERATING]
  TELECOM:
    label: Telecommunications
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY, TELECOM_OPERATING]
    traits: [contract_revenue]
  MEDIA:
    label: Media & Broadcasting
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY]
  SEMICONDUCTORS:
    label: Semiconductors & Related Devices
    is_financial: false
    metric_sets: [COMMERCIAL_CORE, REPORTING_QUALITY, PRODUCT_MARGINS]
    traits: [contract_revenue]
