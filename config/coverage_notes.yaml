# Explanations for metrics short of the coverage target (5 fiscal years, 8 quarters).
# `uw-pipeline coverage-report` flags any gap without a note here as UNEXPLAINED.
# Key "*" applies to every metric of that company.

SKYD:
  "*": >-
    Successor registrant (Skydance / Paramount Skydance) since the 2025-08-07 merger. Only the
    successor's own periods are used (decisions D-012), so history starts with the stub period
    from 2025-08-08 and grows each quarter.
  buybacks: No share repurchases reported by the successor registrant.
  buyback_intensity: No share repurchases reported by the successor registrant.

F:
  goodwill_impairment: >-
    Goodwill impairment is tagged only in years with an impairment; no tag means none was
    recorded in those fiscal years (Phase 15c).
  debt_due_1y: >-
    Same as total_debt: Ford tags debt only with company-extension tags, so neither the maturity
    schedule nor the current portion is available.
  near_term_debt_coverage: >-
    Debt due within one year missing; see debt_due_1y.
  total_debt: >-
    Ford tags debt only with company-extension tags split between Automotive and Ford Credit
    (captive finance). Consolidated debt is dominated by Ford Credit, so an industrial-scope
    figure needs a reviewed override before D/E is shown (NEEDS_REVIEW).
  long_term_debt: Same as total_debt; Ford's debt is tagged with company-extension tags only.
  debt_to_equity: Not computed until Ford's industrial-scope debt override is reviewed.
  interest_expense: >-
    Ford's FY2024 10-Qs and its Q3 2025 10-Q don't tag interest expense, so those quarters
    (and Q4, which needs the 9-month YTD) are missing. Annual values are complete.
  interest_coverage: Same quarters missing as interest_expense.

PFE:
  goodwill_impairment: >-
    Goodwill impairment is tagged only in years with an impairment; no tag means none was
    recorded in those fiscal years (Phase 15c).
  operating_income: >-
    Pfizer's income statement has no operating-income line. Interest coverage uses EBIT =
    pre-tax income + interest expense instead.
  ebitda_computed: Needs operating income, which Pfizer does not report.
  buybacks: >-
    No repurchases since FY2022. Pfizer tags repurchases (or zero) in its 10-K only, so there
    are no quarterly values.
  buyback_intensity: See buybacks.

LUMN:
  inventory_days: >-
    Lumen has reported no inventory line since FY2010; days inventory outstanding does not
    apply.
  buybacks: >-
    No repurchases since FY2022. Reported (as zero) in the 10-K only, so there are no quarterly
    values.
  buyback_intensity: See buybacks.

M:
  goodwill_impairment: >-
    Goodwill impairment is tagged only in years with an impairment; no tag means none was
    recorded in those fiscal years (Phase 15c).
  debt_due_1y: >-
    FY2022 and FY2023: no debt due within the year was tagged (no maturity-schedule tag and no
    current portion of long-term debt in those 10-Ks).
  near_term_debt_coverage: >-
    FY2022 and FY2023 missing; see debt_due_1y.
  interest_expense: >-
    Macy's 10-Qs tag only net interest (InterestIncomeExpenseNonoperatingNet), so gross interest
    expense is annual only.
  interest_coverage: Quarterly gross interest expense is not tagged in Macy's 10-Qs.

LUV:
  inventory_days: >-
    Southwest does not tag InventoryNet (aircraft fuel, parts and supplies sit in other current
    assets); days inventory outstanding does not apply to an airline.
  goodwill_impairment: >-
    Goodwill impairment is tagged only in years with an impairment; no tag means none was
    recorded in those fiscal years (Phase 15c).
  interest_expense: >-
    FY2021 interest expense isn't tagged with a supported tag (InterestExpense ends FY2019,
    InterestExpenseNonoperating starts FY2022).
  interest_coverage: FY2021 interest expense missing; see interest_expense.

JPM:
  goodwill_impairment: >-
    Goodwill impairment is tagged only in years with an impairment; no tag means none was
    recorded in those fiscal years (Phase 15c). JPM tagged a zero impairment in two of the five
    years.
  npl_ratio: >-
    JPM states the nonaccrual-loans-to-total-loans ratio only in its 10-K, so quarterly values
    exist for fiscal Q4 only.

MAR:
  inventory_days: >-
    Marriott is asset-light (management and franchise fees) and has not reported inventory since
    FY2012; days inventory outstanding does not apply.
