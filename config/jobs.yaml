# Scheduled jobs (Phase 6, decisions D-034). Each job runs these stages for all active companies,
# in this order. Stage dependencies (jobs/orchestrator.py) skip a company's later stages when
# a stage they need failed.

jobs:
  # 23:30 ET: SEC accepts filings until 22:00 ET, so the evening's filings are included.
  nightly:
    stages: [company, facts, compute, market, documents, industry, transcripts, news, scores,
             textmetrics, governance, legal, clinical, signals, insights, metricdetail, publish,
             dq, prune]
    refresh_sec: true   # nightly and morning share a UTC date; never reuse the earlier fetch
  # 05:30 ET catch-up: late filings and anything that failed overnight.
  morning:
    stages: [company, facts, compute, market, documents, industry, transcripts, news, scores,
             textmetrics, governance, legal, clinical, signals, insights, metricdetail, publish,
             dq, prune]
    refresh_sec: true

# One run at a time across all jobs (D-041): a start while any run has a fresh heartbeat exits
# with code 2. A RUNNING run whose heartbeat is older than this is treated as dead (e.g. the pod
# was killed); the next start of the same job resumes it if it started within
# `resume_within_hours` and covers the same stages and companies, otherwise it is closed.
stale_after_minutes: 30
resume_within_hours: 12
# The heartbeat is refreshed this often while a long task runs.
heartbeat_minutes: 5
# Attempts per task across the whole run, including resumes.
max_attempts: 2

# Phase 15i: companies run in parallel threads within these stages (stage: workers). LLM calls
# stay under the provider's quota through `rate_limits` in config/llm.yaml. On SQLite (local
# development) only the LLM stages run in parallel (short transactions, D-052, D-061); the
# other stages run one company at a time there. News runs in parallel too (D-079): its time
# is the LLM relevance and event reads; Alpha Vantage calls share one 75-per-minute limiter.
# D-099: the gpt-6-luna stages run 6 workers (was 4; scores 2) within the 2.5M tokens per
# minute this job may use; at most about 0.8M is reserved at once.
parallel:
  textmetrics: 6
  industry: 4
  governance: 6
  legal: 6
  clinical: 6
  signals: 6
  insights: 8
  metricdetail: 6
  scores: 6
  news: 3
# Caps on a SQLite file (local development, D-081): one writer, so more threads only add
# "database is locked" retries. The insights and metric-detail counts above are sized for
# SecureGPT's gpt-6-sol quota (2M tokens per minute, D-099) on Azure SQL.
sqlite_parallel:
  insights: 4
  metricdetail: 4
  textmetrics: 4
  governance: 4
  legal: 4
  clinical: 4
  signals: 4
  scores: 2

# Raw snapshot retention (D-098). Snapshots are only read on the day they are fetched (the
# same-day cache, D-004); older ones only allow a run to be replayed. Files whose name's date is
# older than keep_days are deleted, except the newest file of each folder and any key a
# source_document row references. Folders not listed here are never touched: sec/filings
# (archive documents that later stages read back; D-093 downloads a missing one again),
# av/transcripts (cached without a date), sec/frames and sec/universe. The prune stage does
# each company's folders; `uw-pipeline prune-raw` does those and the shared ones.
raw_retention:
  keep_days: 7
  company_prefixes:            # {cik}: each registrant CIK (10 digits); {symbol}: AV symbols
    - sec/companyfacts/CIK{cik}
    - sec/submissions/CIK{cik}
    - av/daily/{symbol}
    - av/earnings/{symbol}
    - av/news/{symbol}
  shared_prefixes:
    - sec/company_tickers
    - sec/company_tickers_exchange
